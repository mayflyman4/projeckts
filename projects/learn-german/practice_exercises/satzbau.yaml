# "Make a Sentence" — A1-Sprechen-style free practice.
# Given a topic (theme) and a subject word, the learner writes a sentence.
# NOT graded — the `example` is shown afterwards as a model answer only.
# UI chrome is English (like the other sections); the word + example stay German.
# Each item: { theme, subject, example }.

# ── General everyday topics ──
- theme: "Shopping"
  subject: "Brot"
  example: "Ich kaufe jeden Morgen frisches Brot beim Bäcker."
- theme: "Food & Drink"
  subject: "Kaffee"
  example: "Am Morgen trinke ich gern einen Kaffee mit Milch."
- theme: "Family"
  subject: "Schwester"
  example: "Meine Schwester ist zwanzig Jahre alt und wohnt in Berlin."
- theme: "Free time"
  subject: "Fußball"
  example: "Am Wochenende spiele ich mit meinen Freunden Fußball im Park."
- theme: "Home"
  subject: "Küche"
  example: "Unsere Küche ist klein, aber sehr hell."
- theme: "Daily routine"
  subject: "aufstehen"
  example: "Ich stehe von Montag bis Freitag um sechs Uhr auf."
- theme: "Travel"
  subject: "Zug"
  example: "Nächste Woche fahre ich mit dem Zug nach München."
- theme: "Work"
  subject: "Büro"
  example: "Mein Büro ist im dritten Stock und hat ein großes Fenster."
- theme: "Weather"
  subject: "Regen"
  example: "Heute gibt es viel Regen, deshalb bleibe ich zu Hause."
- theme: "Health"
  subject: "Arzt"
  example: "Wenn ich krank bin, gehe ich zum Arzt."
- theme: "Hobbies"
  subject: "Musik"
  example: "In meiner Freizeit höre ich gern Musik und spiele Gitarre."
- theme: "Clothes"
  subject: "Jacke"
  example: "Im Winter trage ich eine warme Jacke und einen Schal."
- theme: "Transport"
  subject: "Bus"
  example: "Ich fahre jeden Tag mit dem Bus zur Arbeit."
- theme: "School"
  subject: "lernen"
  example: "Ich lerne jeden Abend eine Stunde Deutsch."

