id: dativ
label: "Dativ"
description: "Dative case — indirect object and certain prepositions"
exercises:
  - english: "I give the man a book"
    german: "Ich gebe dem Mann ein Buch"
    explanation: "'geben' takes two objects: dative 'wem?' (dem Mann — the receiver) and accusative 'was?' (ein Buch — the thing given). When both objects are full nouns, dative comes before accusative. 'der' → 'dem': masculine dative article."
  - english: "She helps the woman"
    german: "Sie hilft der Frau"
    explanation: "'helfen' belongs to a fixed group of verbs that always govern the dative, never the accusative — also danken, gefallen, gehören, folgen, glauben, gratulieren, passen, schmecken, antworten. Must be memorized per verb, since English 'help someone' looks transitive. 'die' → 'der' (feminine dative)."
  - english: "He writes to the child"
    german: "Er schreibt dem Kind"
    explanation: "Dative marks the addressee/recipient of an action (wem? — to/for whom), separate from any direct object (wen/was? — accusative). 'das' → 'dem': neuter dative."
  - english: "I go to the doctor"
    german: "Ich gehe zum Arzt"
    explanation: "'zu' is one of a closed set of prepositions that ALWAYS take dative, regardless of motion: aus, bei, mit, nach, seit, von, zu, gegenüber. This is different from two-way prepositions (an, auf, in, ...), which switch case by direction. 'zu dem' contracts to 'zum' (masculine)."
  - english: "She comes from the school"
    german: "Sie kommt von der Schule"
    explanation: "'von' is an always-dative preposition (see: aus, bei, mit, nach, seit, von, zu, gegenüber), used here for origin/movement away from a place. 'die' → 'der' (feminine dative)."
  - english: "He lives in the house"
    german: "Er wohnt in dem Haus"
    explanation: "Two-way preposition rule: an, auf, hinter, in, neben, über, unter, vor, zwischen take ACCUSATIVE for motion/direction (wohin?) but DATIVE for static location (wo?). 'wohnen' describes no movement, so dative. 'das' → 'dem', usually contracted to 'im Haus'."
  - english: "I talk to a friend"
    german: "Ich spreche mit einem Freund"
    explanation: "'mit' is always-dative (never accusative, unlike two-way prepositions). Masculine indefinite: 'ein' → 'einem'."
  - english: "She is at home"
    german: "Sie ist zu Hause"
    explanation: "Fixed dative idiom for 'being at home' (no visible article, learned as a set phrase) — contrast with the accusative-flavored idiom 'nach Hause' (going home), which mirrors the wohin/wo distinction two-way prepositions make with real articles."
  - english: "He goes to work"
    german: "Er geht zur Arbeit"
    explanation: "'zu' is always-dative even with a verb of motion like 'gehen' — it is not a two-way preposition. 'zu der' contracts to 'zur' (feminine)."
  - english: "I travel by train"
    german: "Ich reise mit dem Zug"
    explanation: "'mit' (always-dative) here marks the means/instrument ('by/with'). Masculine: 'der' → 'dem'."
  - english: "She sits on the chair"
    german: "Sie sitzt auf dem Stuhl"
    explanation: "Two-way preposition 'auf' + static location ('sitzen' = staying put, wo?) → dative. 'der' → 'dem'. Compare accusative 'Sie setzt sich auf den Stuhl' (she sits down onto the chair — motion, wohin?)."
  - english: "He stands at the door"
    german: "Er steht an der Tür"
    explanation: "Two-way preposition 'an' + static location ('stehen' = wo?) → dative. 'die' → 'der' (feminine)."
  - english: "I give a gift to my mother"
    german: "Ich gebe meiner Mutter ein Geschenk"
    explanation: "Possessive determiners decline exactly like 'ein/eine' by gender and case: feminine dative 'meine' → 'meiner'. Same double-object pattern as 'geben' above — dative 'meiner Mutter' (receiver) before accusative 'ein Geschenk' (thing given)."
  - english: "She speaks with the teacher"
    german: "Sie spricht mit dem Lehrer"
    explanation: "'mit' (always-dative). Masculine: 'der' → 'dem'."
  - english: "He lives near the church"
    german: "Er wohnt bei der Kirche"
    explanation: "'bei' is always-dative, expressing proximity ('near/at'). Feminine: 'die' → 'der'."
  - english: "I meet with a friend"
    german: "Ich treffe mich mit einem Freund"
    explanation: "Reflexive verb 'sich treffen' plus the always-dative preposition 'mit'. Masculine indefinite: 'ein' → 'einem'."
  - english: "She goes to the supermarket"
    german: "Sie geht zum Supermarkt"
    explanation: "'zu' stays dative even with motion verbs — it is always-dative, not a two-way preposition. 'zu dem' → 'zum' (masculine)."
  - english: "He comes from Germany"
    german: "Er kommt aus Deutschland"
    explanation: "'aus' (always-dative) marks origin. Country and city names are usually used without an article, so the dative isn't visible here — compare 'aus dem Land' where the article does show 'dem'."
  - english: "I am at the station"
    german: "Ich bin am Bahnhof"
    explanation: "Two-way preposition 'an' + static location ('sein' = wo?, no motion) → dative. 'an dem' contracts to 'am' (masculine)."
  - english: "She gives the child the ball"
    german: "Sie gibt dem Kind den Ball"
    explanation: "Double-object word order: dative 'wem?' (dem Kind — receiver) comes before accusative 'wen/was?' (den Ball — the thing) when both objects are full noun phrases, not pronouns."
  - english: "I thank the teacher"
    german: "Ich danke der Lehrerin"
    explanation: "'danken' is a dative-only verb (like helfen, gefallen, gehören) — English 'thank someone' looks accusative, but German always uses dative here. Feminine: 'die' → 'der'."
  - english: "He answers the boss"
    german: "Er antwortet dem Chef"
    explanation: "'antworten' governs dative (the person answered), not accusative — a common learner mistake since English treats it as transitive. Masculine: 'der' → 'dem'."
  - english: "I like the movie"
    german: "Der Film gefällt mir"
    explanation: "'gefallen' (dative verb, literally 'to be pleasing to') flips the English structure: the thing liked is the NOMINATIVE subject ('Der Film'), and the person who likes it is the DATIVE object — 'mir' is the 1st person singular dative pronoun (ich → mir)."
  - english: "The car belongs to him"
    german: "Das Auto gehört ihm"
    explanation: "'gehören' (dative verb, 'to belong to') puts the owner in the dative: 'ihm' is the masculine/neuter 3rd person singular dative pronoun (er/es → ihm)."
  - english: "I help the boy"
    german: "Ich helfe dem Jungen"
    explanation: "'der Junge' is a weak noun ('n-Deklination'): it adds '-(e)n' in every case except nominative singular — dative 'dem Jungen', not 'dem Junge'. Same pattern as 'der Student' → 'dem Studenten'."
  - english: "We congratulate the parents"
    german: "Wir gratulieren den Eltern"
    explanation: "'gratulieren' is dative-only. Plural dative articles are always 'den', and plural nouns add '-n' in the dative UNLESS the plural already ends in '-n' or '-s' — 'Eltern' already ends in '-n', so the noun itself doesn't change, only 'die' → 'den'."
  - english: "I write the children a letter"
    german: "Ich schreibe den Kindern einen Brief"
    explanation: "Contrast with 'Eltern' above: 'Kinder' does NOT end in '-n' in the plural, so the dative plural rule adds one: 'Kinder' → 'Kindern'. Also a double object: dative 'den Kindern' (receivers) before accusative 'einen Brief' (thing given)."
  - english: "The dog lies in front of the house"
    german: "Der Hund liegt vor dem Haus"
    explanation: "Two-way preposition 'vor' + static location ('liegen' = wo?, no motion) → dative. 'das' → 'dem'. Compare accusative 'Der Hund legt sich vor das Haus' (the dog lies down in front of the house — motion, wohin?)."
  - english: "The key lies between the books"
    german: "Der Schlüssel liegt zwischen den Büchern"
    explanation: "Two-way preposition 'zwischen' + static location → dative. Plural dative: 'die Bücher' → 'den Büchern', adding '-n' since the plural doesn't already end in '-n' or '-s' (same rule as 'Kindern' above)."
  - english: "I help the small child"
    german: "Ich helfe dem kleinen Kind"
    explanation: "Adjective endings after a der-word (dem) are always '-en' in the dative, for all three genders — 'klein' → 'kleinen'. This '-en' pattern holds across the whole dative case, unlike nominative/accusative where the ending can vary by gender."
