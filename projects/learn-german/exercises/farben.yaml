id: farben
label: "Farben"
description: "Colors"
exercises:
  - english: "red"
    german: "rot"
  - english: "blue"
    german: "blau"
  - english: "green"
    german: "grün"
  - english: "yellow"
    german: "gelb"
  - english: "black"
    german: "schwarz"
  - english: "white"
    german: "weiß"
  - english: "orange"
    german: "orange"
  - english: "pink"
    german: "rosa"
  - english: "purple"
    german: "lila"
  - english: "brown"
    german: "braun"
  - english: "grey"
    german: "grau"
  - english: "The car is red"
    german: "Das Auto ist rot"
  - english: "The sky is blue"
    german: "Der Himmel ist blau"
  - english: "The grass is green"
    german: "Das Gras ist grün"
  - english: "The sun is yellow"
    german: "Die Sonne ist gelb"
  - english: "My bag is black"
    german: "Meine Tasche ist schwarz"
  - english: "The snow is white"
    german: "Der Schnee ist weiß"
  - english: "The rose is pink"
    german: "Die Rose ist rosa"
  - english: "What color is it?"
    german: "Welche Farbe hat es?"
    explanation: "German uses 'haben' (to have) for color, not 'sein' (to be): literally 'What color does it have?'"
  - english: "I like green"
    german: "Ich mag Grün"
    explanation: "As a noun a color is neuter and capitalized ('das Grün'); the predicative adjective stays lowercase ('ist grün')."
