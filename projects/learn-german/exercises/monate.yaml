id: monate
label: "Monate & Jahreszeiten"
description: "Months and seasons"
exercises:
  - english: "January"
    german: "Januar"
  - english: "February"
    german: "Februar"
  - english: "March"
    german: "März"
  - english: "April"
    german: "April"
  - english: "May"
    german: "Mai"
  - english: "June"
    german: "Juni"
  - english: "July"
    german: "Juli"
  - english: "August"
    german: "August"
  - english: "September"
    german: "September"
  - english: "October"
    german: "Oktober"
  - english: "November"
    german: "November"
  - english: "December"
    german: "Dezember"
  - english: "What month is it?"
    german: "Welcher Monat ist es?"
    explanation: "'Welcher' is the masculine W-question word agreeing with 'der Monat'; months are masculine."
  - english: "In January"
    german: "Im Januar"
    explanation: "Months take 'im' (= in dem) for 'in [month]': im Januar, im Juni."
  - english: "My birthday is in June"
    german: "Mein Geburtstag ist im Juni"
    explanation: "'im Juni' = in June; months always use 'im' (in dem) for 'in'."
  - english: "spring"
    german: "der Frühling"
    explanation: "All four seasons are masculine: der Frühling, der Sommer, der Herbst, der Winter."
  - english: "summer"
    german: "der Sommer"
  - english: "autumn"
    german: "der Herbst"
  - english: "winter"
    german: "der Winter"
  - english: "In winter it is cold"
    german: "Im Winter ist es kalt"
    explanation: "Fronted time phrase 'Im Winter' forces verb-second order: 'ist' comes before the subject 'es'."
