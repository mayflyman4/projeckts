id: nominativ
label: "Nominativ"
description: "Nominative case — subject of the sentence"
exercises:
  - english: "The man is tall"
    german: "Der Mann ist groß"
    explanation: "'Der' = masculine nominative article. Mann is the subject (the one being described)."
    akkusativ: "Ich sehe den Mann."
    dativ: "Ich helfe dem Mann."
  - english: "The woman is beautiful"
    german: "Die Frau ist schön"
    explanation: "'Die' = feminine nominative article. Frau is the subject."
    akkusativ: "Ich sehe die Frau."
    dativ: "Ich helfe der Frau."
  - english: "The child plays"
    german: "Das Kind spielt"
    explanation: "'Das' = neuter nominative article. Kind is the subject doing the action."
    akkusativ: "Ich sehe das Kind."
    dativ: "Ich helfe dem Kind."
  - english: "The dog is small"
    german: "Der Hund ist klein"
    explanation: "'Der' = masculine nominative. Hund is the subject being described."
    akkusativ: "Ich sehe den Hund."
    dativ: "Ich helfe dem Hund."
  - english: "A cat is sleeping"
    german: "Eine Katze schläft"
    explanation: "'Eine' = feminine indefinite nominative. Note 'schläft': schlafen is irregular (a→ä in er/sie/es)."
    akkusativ: "Ich sehe eine Katze."
    dativ: "Ich helfe einer Katze."
  - english: "The house is big"
    german: "Das Haus ist groß"
    explanation: "'Das' = neuter nominative. Haus is the subject being described."
    akkusativ: "Ich sehe das Haus."
    dativ: "Ich wohne in dem Haus."
  - english: "A man is coming"
    german: "Ein Mann kommt"
    explanation: "'Ein' = masculine indefinite nominative. Mann is the subject doing the action."
    akkusativ: "Ich sehe einen Mann."
    dativ: "Ich helfe einem Mann."
  - english: "The teacher is kind"
    german: "Der Lehrer ist nett"
    explanation: "'Der' = masculine nominative. Lehrer is the subject being described."
    akkusativ: "Ich sehe den Lehrer."
    dativ: "Ich helfe dem Lehrer."
  - english: "A student learns"
    german: "Ein Student lernt"
    explanation: "'Ein' = masculine indefinite nominative. Student is the subject doing the action."
    akkusativ: "Ich sehe einen Studenten."
    dativ: "Ich helfe einem Studenten."
  - english: "The coffee is hot"
    german: "Der Kaffee ist heiß"
    explanation: "'Der' = masculine nominative. Kaffee is the subject."
    akkusativ: "Ich trinke den Kaffee."
    dativ: "Die Milch ist in dem Kaffee."
  - english: "The car is red"
    german: "Das Auto ist rot"
    explanation: "'Das' = neuter nominative. Auto is the subject being described."
    akkusativ: "Ich sehe das Auto."
    dativ: "Ich sitze in dem Auto."
  - english: "A child is playing"
    german: "Ein Kind spielt"
    explanation: "'Ein' = neuter indefinite nominative (not 'eine' — Kind is neuter). Kind is the subject."
    akkusativ: "Ich sehe ein Kind."
    dativ: "Ich helfe einem Kind."
  - english: "The school is closed"
    german: "Die Schule ist geschlossen"
    explanation: "'Die' = feminine nominative. Schule is the subject."
    akkusativ: "Ich sehe die Schule."
    dativ: "Ich bin in der Schule."
  - english: "The phone rings"
    german: "Das Telefon klingelt"
    explanation: "'Das' = neuter nominative. Telefon is the subject doing the action."
    akkusativ: "Ich sehe das Telefon."
    dativ: "Die App ist in dem Telefon."
  - english: "A woman is singing"
    german: "Eine Frau singt"
    explanation: "'Eine' = feminine indefinite nominative. Frau is the subject."
    akkusativ: "Ich sehe eine Frau."
    dativ: "Ich helfe einer Frau."
  - english: "The window is open"
    german: "Das Fenster ist offen"
    explanation: "'Das' = neuter nominative. Fenster is the subject."
    akkusativ: "Ich sehe das Fenster."
    dativ: "Ich stehe an dem Fenster."
  - english: "The door is closed"
    german: "Die Tür ist geschlossen"
    explanation: "'Die' = feminine nominative. Tür has an unpredictable feminine gender and an umlaut to memorize."
    akkusativ: "Ich sehe die Tür."
    dativ: "Ich stehe an der Tür."
  - english: "A friend comes"
    german: "Ein Freund kommt"
    explanation: "'Ein' = masculine indefinite nominative. Freund is the subject doing the action."
    akkusativ: "Ich sehe einen Freund."
    dativ: "Ich helfe einem Freund."
  - english: "The bus is late"
    german: "Der Bus ist spät"
    explanation: "'Der' = masculine nominative. Bus is the subject."
    akkusativ: "Ich sehe den Bus."
    dativ: "Ich sitze in dem Bus."
  - english: "The book is interesting"
    german: "Das Buch ist interessant"
    explanation: "'Das' = neuter nominative. Buch is the subject being described."
    akkusativ: "Ich sehe das Buch."
    dativ: "Der Name steht in dem Buch."
  - english: "This is my father"
    german: "Das ist mein Vater"
    explanation: "New format: 'Das ist ...' identifies someone/something — the noun after 'sein' is still nominative, not accusative. 'mein' (masculine) is unmarked in nominative, like 'ein'."
    akkusativ: "Ich sehe meinen Vater."
    dativ: "Ich helfe meinem Vater."
  - english: "This is my mother"
    german: "Das ist meine Mutter"
    explanation: "'meine' (feminine nominative) — possessives take the same endings as 'ein/eine' by gender."
    akkusativ: "Ich sehe meine Mutter."
    dativ: "Ich helfe meiner Mutter."
  - english: "This is my brother"
    german: "Das ist mein Bruder"
    akkusativ: "Ich sehe meinen Bruder."
    dativ: "Ich helfe meinem Bruder."
  - english: "This is my sister"
    german: "Das ist meine Schwester"
    akkusativ: "Ich sehe meine Schwester."
    dativ: "Ich helfe meiner Schwester."
  - english: "This is my girlfriend"
    german: "Das ist meine Freundin"
    akkusativ: "Ich sehe meine Freundin."
    dativ: "Ich helfe meiner Freundin."
  - english: "This is a table"
    german: "Das ist ein Tisch"
    explanation: "'ein Tisch': masculine indefinite nominative predicate after 'ist' — used to identify an object, not to mark a direct object."
    akkusativ: "Ich sehe einen Tisch."
    dativ: "Das Buch liegt auf einem Tisch."
  - english: "This is a chair"
    german: "Das ist ein Stuhl"
    akkusativ: "Ich sehe einen Stuhl."
    dativ: "Ich sitze auf einem Stuhl."
  - english: "This is an apple"
    german: "Das ist ein Apfel"
    akkusativ: "Ich esse einen Apfel."
    dativ: "Der Wurm ist in einem Apfel."
  - english: "This is a computer"
    german: "Das ist ein Computer"
    akkusativ: "Ich sehe einen Computer."
    dativ: "Ich arbeite an einem Computer."
  - english: "This is a key"
    german: "Das ist ein Schlüssel"
    akkusativ: "Ich suche einen Schlüssel."
    dativ: "Die Tür öffnet sich mit einem Schlüssel."
  - english: "This is a street"
    german: "Das ist eine Straße"
    explanation: "'eine Straße': feminine indefinite nominative predicate — 'eine' is unchanged from the article's dictionary form."
    akkusativ: "Ich sehe eine Straße."
    dativ: "Die Kinder spielen auf einer Straße."
  - english: "This is a city"
    german: "Das ist eine Stadt"
    akkusativ: "Ich besuche eine Stadt."
    dativ: "Ich wohne in einer Stadt."
  - english: "This is a clock"
    german: "Das ist eine Uhr"
    akkusativ: "Ich kaufe eine Uhr."
    dativ: "Die Zeit steht auf einer Uhr."
  - english: "This is a bag"
    german: "Das ist eine Tasche"
    akkusativ: "Ich trage eine Tasche."
    dativ: "Das Geld ist in einer Tasche."
  - english: "This is a flower"
    german: "Das ist eine Blume"
    akkusativ: "Ich kaufe eine Blume."
    dativ: "Die Biene sitzt auf einer Blume."
  - english: "This is a room"
    german: "Das ist ein Zimmer"
    explanation: "'ein Zimmer': neuter indefinite nominative predicate — 'ein' is unmarked, same form as masculine here."
    akkusativ: "Ich sehe ein Zimmer."
    dativ: "Ich schlafe in einem Zimmer."
  - english: "This is a country"
    german: "Das ist ein Land"
    akkusativ: "Ich besuche ein Land."
    dativ: "Ich wohne in einem Land."
  - english: "This is a bed"
    german: "Das ist ein Bett"
    akkusativ: "Ich kaufe ein Bett."
    dativ: "Ich schlafe in einem Bett."
  - english: "This is a sofa"
    german: "Das ist ein Sofa"
    akkusativ: "Ich sehe ein Sofa."
    dativ: "Ich sitze auf einem Sofa."
  - english: "This is a radio"
    german: "Das ist ein Radio"
    akkusativ: "Ich höre ein Radio."
    dativ: "Die Musik kommt aus einem Radio."
  - english: "He is tired"
    german: "Er ist müde"
    explanation: "'Er' = 3rd person masculine nominative pronoun (subject). Its accusative is 'ihn', its dative is 'ihm'."
    akkusativ: "Ich sehe ihn."
    dativ: "Ich helfe ihm."
  - english: "She is happy"
    german: "Sie ist glücklich"
    explanation: "'sie' (lowercase) = 3rd person feminine nominative pronoun. Accusative stays 'sie'; dative becomes 'ihr'."
    akkusativ: "Ich sehe sie."
    dativ: "Ich helfe ihr."
  - english: "It is broken"
    german: "Es ist kaputt"
    explanation: "'Es' = 3rd person neuter nominative pronoun. Accusative stays 'es'; dative becomes 'ihm' (same as masculine)."
    akkusativ: "Ich sehe es."
    dativ: "Ich helfe ihm."
  - english: "We are here"
    german: "Wir sind hier"
    explanation: "'Wir' = 1st person plural nominative pronoun. Accusative and dative are both 'uns'."
    akkusativ: "Ihr seht uns."
    dativ: "Ihr helft uns."
  - english: "You are late (plural, informal)"
    german: "Ihr seid spät"
    explanation: "'Ihr' (capitalized only at sentence start) = 2nd person plural informal nominative pronoun — not the possessive 'ihr' (her/their). Accusative and dative are both 'euch'."
    akkusativ: "Wir sehen euch."
    dativ: "Wir helfen euch."
  - english: "They are friends"
    german: "Sie sind Freunde"
    explanation: "'sie' (plural 'they') = 3rd person plural nominative pronoun — same spelling as formal 'Sie' (you); verb form and context tell them apart. Accusative stays 'sie'; dative becomes 'ihnen'."
    akkusativ: "Ich sehe sie."
    dativ: "Ich helfe ihnen."
  - english: "This is his father"
    german: "Das ist sein Vater"
    explanation: "'sein' = his (possessive for er/es) — declines like 'ein', unmarked before a masculine nominative noun."
    akkusativ: "Er sieht seinen Vater."
    dativ: "Er hilft seinem Vater."
  - english: "This is her brother"
    german: "Das ist ihr Bruder"
    explanation: "'ihr' = her (possessive for sie, singular) — identical spelling to the pronoun 'ihr' (you-plural), but a different word with a different role."
    akkusativ: "Sie sieht ihren Bruder."
    dativ: "Sie hilft ihrem Bruder."
  - english: "This is her car"
    german: "Das ist ihr Auto"
    akkusativ: "Sie sieht ihr Auto."
    dativ: "Sie sitzt in ihrem Auto."
  - english: "This is our teacher"
    german: "Das ist unser Lehrer"
    explanation: "'unser' = our."
    akkusativ: "Wir sehen unseren Lehrer."
    dativ: "Wir helfen unserem Lehrer."
  - english: "This is our house"
    german: "Das ist unser Haus"
    akkusativ: "Wir sehen unser Haus."
    dativ: "Wir wohnen in unserem Haus."
  - english: "This is your dog (plural, informal)"
    german: "Das ist euer Hund"
    explanation: "'euer' = your (informal plural) — drops the 'e' before an ending: 'eure', 'euren', 'eurem'."
    akkusativ: "Ich sehe euren Hund."
    dativ: "Ich helfe eurem Hund."
  - english: "This is your son (formal)"
    german: "Das ist Ihr Sohn"
    explanation: "'Ihr' = formal 'your' — always capitalized; identical in form to 'ihr' (her/their) but the capital marks the formal register."
    akkusativ: "Ich sehe Ihren Sohn."
    dativ: "Ich helfe Ihrem Sohn."
  - english: "This is their daughter"
    german: "Das ist ihre Tochter"
    explanation: "'ihre' = their (possessive for sie, plural) — same spelling as 'ihre' (her), since both are 3rd person; context tells them apart."
    akkusativ: "Ich sehe ihre Tochter."
    dativ: "Ich helfe ihrer Tochter."
