id: artikel
label: "Artikel"
description: "der / die / das — German definite articles"
exercises:
  - english: "the man"
    german: "der Mann"
    plural: "die Männer"
  - english: "the woman"
    german: "die Frau"
    plural: "die Frauen"
  - english: "the child"
    german: "das Kind"
    plural: "die Kinder"
    explanation: "'das Kind': neuter, even though it refers to a person — gender here is grammatical, not natural."
  - english: "the tree"
    german: "der Baum"
    plural: "die Bäume"
    explanation: "'der Baum': masculine and takes an umlaut in the plural 'Bäume'."
  - english: "the flower"
    german: "die Blume"
    plural: "die Blumen"
  - english: "the house"
    german: "das Haus"
    plural: "die Häuser"
  - english: "the book"
    german: "das Buch"
    plural: "die Bücher"
    explanation: "'das Buch': neuter — learners often wrongly expect 'der'."
  - english: "the cat"
    german: "die Katze"
    plural: "die Katzen"
    explanation: "'die Katze': feminine as a noun regardless of the animal's actual sex."
  - english: "the dog"
    german: "der Hund"
    plural: "die Hunde"
  - english: "the car"
    german: "das Auto"
    plural: "die Autos"
    explanation: "'das Auto': neuter loanword; learners often wrongly guess 'der'."
  - english: "the school"
    german: "die Schule"
    plural: "die Schulen"
  - english: "the table"
    german: "der Tisch"
    plural: "die Tische"
  - english: "the door"
    german: "die Tür"
    plural: "die Türen"
    explanation: "'die Tür': feminine and umlauted; frequently mis-gendered."
  - english: "the window"
    german: "das Fenster"
    plural: "die Fenster"
    explanation: "'das Fenster': neuter, even though the -er ending often signals masculine (e.g. der Computer)."
  - english: "the city"
    german: "die Stadt"
    plural: "die Städte"
    explanation: "'die Stadt': feminine; note the umlauted plural 'Städte'."
  - english: "the country"
    german: "das Land"
    plural: "die Länder"
    explanation: "'das Land': neuter; the umlauted plural is 'Länder'."
  - english: "the apple"
    german: "der Apfel"
    plural: "die Äpfel"
    explanation: "'der Apfel': masculine and takes an umlaut in the plural 'Äpfel'."
  - english: "the bottle"
    german: "die Flasche"
    plural: "die Flaschen"
  - english: "the key"
    german: "der Schlüssel"
    plural: "die Schlüssel"
    explanation: "'der Schlüssel': masculine; the gender of -el nouns is not predictable and must be memorized."
  - english: "the letter"
    german: "der Brief"
    plural: "die Briefe"
    explanation: "'der Brief': masculine; means a postal letter (not 'letter' as in alphabet, which is 'der Buchstabe')."
  - english: "the time"
    german: "die Zeit"
    plural: "die Zeiten"
  - english: "the year"
    german: "das Jahr"
    plural: "die Jahre"
  - english: "the day"
    german: "der Tag"
    plural: "die Tage"
  - english: "the week"
    german: "die Woche"
    plural: "die Wochen"
  - english: "the month"
    german: "der Monat"
    plural: "die Monate"
  - english: "the hour"
    german: "die Stunde"
    plural: "die Stunden"
  - english: "the minute"
    german: "die Minute"
    plural: "die Minuten"
  - english: "the friend (male)"
    german: "der Freund"
    plural: "die Freunde"
  - english: "the friend (female)"
    german: "die Freundin"
    plural: "die Freundinnen"
    explanation: "Feminine forms in '-in' double the 'n' before adding '-en' in the plural: Freundin → Freundinnen."
  - english: "the family"
    german: "die Familie"
    plural: "die Familien"
  - english: "the mother"
    german: "die Mutter"
    plural: "die Mütter"
    explanation: "'die Mutter': feminine but still takes an umlaut in the plural — umlaut plurals aren't only for masculine/neuter nouns."
  - english: "the father"
    german: "der Vater"
    plural: "die Väter"
  - english: "the brother"
    german: "der Bruder"
    plural: "die Brüder"
  - english: "the sister"
    german: "die Schwester"
    plural: "die Schwestern"
  - english: "the work / job"
    german: "die Arbeit"
    plural: "die Arbeiten"
    explanation: "'die Arbeit' is usually uncountable (singular only); the plural 'Arbeiten' means separate pieces of work/assignments."
  - english: "the room"
    german: "das Zimmer"
    plural: "die Zimmer"
  - english: "the bed"
    german: "das Bett"
    plural: "die Betten"
  - english: "the chair"
    german: "der Stuhl"
    plural: "die Stühle"
  - english: "the computer"
    german: "der Computer"
    plural: "die Computer"
  - english: "the telephone"
    german: "das Telefon"
    plural: "die Telefone"
  - english: "the mobile phone"
    german: "das Handy"
    plural: "die Handys"
    explanation: "'das Handy' is a false friend — it doesn't mean 'handy' in English, and as a loanword it takes an '-s' plural."
  - english: "the train"
    german: "der Zug"
    plural: "die Züge"
  - english: "the bus"
    german: "der Bus"
    plural: "die Busse"
  - english: "the airplane"
    german: "das Flugzeug"
    plural: "die Flugzeuge"
  - english: "the world"
    german: "die Welt"
    plural: "die Welten"
  - english: "the person / human"
    german: "der Mensch"
    plural: "die Menschen"
    explanation: "'der Mensch' is a weak noun ('n-Deklination'): it takes '-en' in every case except nominative singular (den/dem/des Menschen)."
  - english: "the word"
    german: "das Wort"
    plural: "die Wörter"
    explanation: "'das Wort' has two plurals: 'Wörter' for individual, unrelated words; 'Worte' for words in a coherent context (a speech, a quote)."
  - english: "the language"
    german: "die Sprache"
    plural: "die Sprachen"
  - english: "the question"
    german: "die Frage"
    plural: "die Fragen"
  - english: "the answer"
    german: "die Antwort"
    plural: "die Antworten"
