id: familie
label: "Familie"
description: "Family members"
exercises:
  - english: "mother"
    german: "die Mutter"
  - english: "father"
    german: "der Vater"
  - english: "sister"
    german: "die Schwester"
  - english: "brother"
    german: "der Bruder"
  - english: "grandmother"
    german: "die Großmutter"
  - english: "grandfather"
    german: "der Großvater"
  - english: "daughter"
    german: "die Tochter"
  - english: "son"
    german: "der Sohn"
  - english: "aunt"
    german: "die Tante"
  - english: "uncle"
    german: "der Onkel"
  - english: "cousin (female)"
    german: "die Cousine"
  - english: "cousin (male)"
    german: "der Cousin"
  - english: "wife"
    german: "die Frau / Ehefrau"
  - english: "husband"
    german: "der Mann / Ehemann"
  - english: "parents"
    german: "die Eltern"
    explanation: "'die Eltern' is a plural-only noun — no singular form, always takes plural 'die'."
  - english: "children"
    german: "die Kinder"
    explanation: "Irregular plural of 'das Kind' → 'die Kinder' (-er plural); plural article is always 'die'."
  - english: "grandparents"
    german: "die Großeltern"
    explanation: "'die Großeltern' is plural-only, like 'Eltern' — no singular form."
  - english: "My mother is kind"
    german: "Meine Mutter ist nett"
  - english: "I have two brothers"
    german: "Ich habe zwei Brüder"
    explanation: "Plural of 'der Bruder' is 'die Brüder' — the -u- takes an umlaut, no ending added."
  - english: "Her sister is a doctor"
    german: "Ihre Schwester ist Ärztin"
    explanation: "No article before professions: 'ist Ärztin', not 'ist eine Ärztin'; feminine adds -in and umlauts: 'Arzt' → 'Ärztin'."
