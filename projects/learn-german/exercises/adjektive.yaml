id: adjektive
label: "Adjektive"
description: "Common A1 adjectives"
exercises:
  - english: "big"
    german: "groß"
  - english: "small"
    german: "klein"
  - english: "good"
    german: "gut"
  - english: "bad"
    german: "schlecht"
  - english: "fast"
    german: "schnell"
  - english: "slow"
    german: "langsam"
  - english: "hot"
    german: "heiß"
    explanation: "'heiß' describes things/weather; for feeling hot say 'Mir ist heiß' — 'Ich bin heiß' means 'I'm aroused'."
  - english: "cold"
    german: "kalt"
  - english: "new"
    german: "neu"
  - english: "old"
    german: "alt"
  - english: "beautiful"
    german: "schön"
  - english: "expensive"
    german: "teuer"
    explanation: "'teuer' drops the inner 'e' when inflected: teure Schuhe, not teuere."
  - english: "cheap"
    german: "günstig"
  - english: "happy"
    german: "glücklich"
  - english: "sad"
    german: "traurig"
  - english: "tired"
    german: "müde"
  - english: "hungry"
    german: "hungrig"
  - english: "thirsty"
    german: "durstig"
  - english: "interesting"
    german: "interessant"
  - english: "easy"
    german: "einfach"
