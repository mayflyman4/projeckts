id: nomen
label: "Nomen"
description: "Basic nouns with their articles"
exercises:
  - english: "the house"
    german: "das Haus"
  - english: "the car"
    german: "das Auto"
    explanation: "'Auto' is neuter (das), not masculine — a common trap since learners expect 'der' for vehicles."
  - english: "the dog"
    german: "der Hund"
  - english: "the cat"
    german: "die Katze"
  - english: "the book"
    german: "das Buch"
  - english: "the table"
    german: "der Tisch"
  - english: "the chair"
    german: "der Stuhl"
  - english: "the water"
    german: "das Wasser"
  - english: "the bread"
    german: "das Brot"
  - english: "the milk"
    german: "die Milch"
    explanation: "'Milch' is feminine (die) — gender is unpredictable and must be memorised."
  - english: "the apple"
    german: "der Apfel"
    explanation: "'Apfel' is masculine (der) and takes an umlaut in the plural: die Äpfel."
  - english: "the city"
    german: "die Stadt"
    explanation: "'Stadt' is feminine (die) and has an umlaut plural: die Städte."
  - english: "the street"
    german: "die Straße"
    explanation: "'Straße' is written with ß after the long vowel; never 'Strasse' in standard German."
  - english: "the school"
    german: "die Schule"
  - english: "the door"
    german: "die Tür"
    explanation: "'Tür' is feminine (die) — the gender of this short word is unpredictable and must be learned."
  - english: "the window"
    german: "das Fenster"
    explanation: "'Fenster' is neuter (das); the -er ending often looks masculine but here it is not."
  - english: "the phone"
    german: "das Telefon"
    explanation: "'Telefon' is neuter (das); the gender is not guessable from the word."
  - english: "the bag"
    german: "die Tasche"
  - english: "the key"
    german: "der Schlüssel"
    explanation: "'Schlüssel' is masculine (der); most nouns ending in -el are masculine (der Löffel, der Mantel)."
  - english: "the time"
    german: "die Zeit"
    explanation: "'Zeit' is feminine (die) — like many abstract nouns its gender must be memorised."
  - english: "the man"
    german: "der Mann"
    explanation: "Plural: die Männer (umlaut). Contrast: der Mann (husband/man) vs. die Männer."
  - english: "the woman"
    german: "die Frau"
    explanation: "Also means 'Mrs/Ms' as a title: Frau Schmidt. Plural: die Frauen."
  - english: "the child"
    german: "das Kind"
    explanation: "'Kind' is neuter (das); plural is die Kinder — the -er plural without umlaut."
  - english: "the father"
    german: "der Vater"
    explanation: "Plural: die Väter (with umlaut). Similarly: der Bruder → die Brüder."
  - english: "the mother"
    german: "die Mutter"
    explanation: "Plural: die Mütter (umlaut). The -er plural here does add an umlaut, unlike Kinder."
  - english: "the brother"
    german: "der Bruder"
    explanation: "Plural: die Brüder (umlaut). Brother and sister often come up together: Geschwister."
  - english: "the sister"
    german: "die Schwester"
    explanation: "Plural: die Schwestern. All -ster/-ster words are feminine."
  - english: "the male friend / boyfriend"
    german: "der Freund"
    explanation: "'der Freund' = male friend or boyfriend depending on context. Plural: die Freunde."
  - english: "the female friend / girlfriend"
    german: "die Freundin"
    explanation: "The -in suffix makes a feminine form. Plural: die Freundinnen (double -n)."
  - english: "the family"
    german: "die Familie"
    explanation: "'Familie' is feminine (die). Plural: die Familien. The -ie ending is always feminine."
  - english: "the name"
    german: "der Name"
    explanation: "Weak masculine noun: in all cases except nominative it adds -n: des Namens, dem Namen."
  - english: "the address"
    german: "die Adresse"
    explanation: "Feminine (-e ending nouns are often feminine). Plural: die Adressen."
  - english: "the number"
    german: "die Nummer"
    explanation: "Feminine. Plural: die Nummern. Used for phone numbers, room numbers, etc."
  - english: "the letter"
    german: "der Brief"
    explanation: "Masculine. Plural: die Briefe. Contrast with die Briefmarke (stamp)."
  - english: "the email"
    german: "die E-Mail"
    explanation: "Feminine (die), borrowed from English. Plural: die E-Mails."
  - english: "the mobile phone"
    german: "das Handy"
    explanation: "Neuter, borrowed from English but used differently — in German 'Handy' always means mobile phone."
  - english: "the computer"
    german: "der Computer"
    explanation: "Masculine. Plural: die Computer (no change). The -er plural without umlaut is common for borrowed words."
  - english: "the form / document"
    german: "das Formular"
    explanation: "Neuter. Plural: die Formulare. You 'ausfüllen' (fill out) a Formular."
  - english: "the exam / test"
    german: "die Prüfung"
    explanation: "Feminine (-ung nouns are always feminine). Plural: die Prüfungen. The -ung suffix is a reliable gender marker."
  - english: "the course / class"
    german: "der Kurs"
    explanation: "Masculine. Plural: die Kurse. Commonly used for language courses: ein Deutschkurs."
  - english: "the office"
    german: "das Büro"
    explanation: "Neuter. Plural: die Büros. Words ending in -o that are borrowed are often neuter."
  - english: "the train station"
    german: "der Bahnhof"
    explanation: "'Bahnhof' is a compound: die Bahn (train) + der Hof (yard/court). Compounds take the gender of the last element, so der Bahnhof."
  - english: "the train"
    german: "der Zug"
    explanation: "Masculine. Plural: die Züge (umlaut + e). Distinct from die Bahn (the railway system/network)."
  - english: "the bus"
    german: "der Bus"
    explanation: "Masculine. Plural: die Busse (double s)."
  - english: "the bicycle"
    german: "das Fahrrad"
    explanation: "Compound: fahren (to drive) + das Rad (wheel). Plural: die Fahrräder."
  - english: "the taxi"
    german: "das Taxi"
    explanation: "Neuter. Plural: die Taxis. Short borrowed nouns ending in a vowel are often neuter."
  - english: "the airplane"
    german: "das Flugzeug"
    explanation: "Compound: fliegen (to fly) + das Zeug (stuff/gear). Neuter. Plural: die Flugzeuge."
  - english: "the airport"
    german: "der Flughafen"
    explanation: "Compound: fliegen + der Hafen (harbour/port). Masculine because der Hafen is masculine."
  - english: "the suitcase"
    german: "der Koffer"
    explanation: "Masculine. Plural: die Koffer (no change). The -er plural without umlaut."
  - english: "the hotel"
    german: "das Hotel"
    explanation: "Neuter. Plural: die Hotels. Most international hotel/hostel words are neuter in German."
  - english: "the room"
    german: "das Zimmer"
    explanation: "Neuter. Plural: die Zimmer (no change). Common in: das Schlafzimmer, das Wohnzimmer."
  - english: "the bed"
    german: "das Bett"
    explanation: "Neuter. Plural: die Betten (double t + en)."
  - english: "the sofa"
    german: "das Sofa"
    explanation: "Neuter. Plural: die Sofas. Borrowed words ending in -a are often neuter."
  - english: "the wardrobe / cupboard"
    german: "der Schrank"
    explanation: "Masculine. Plural: die Schränke (umlaut + e). Used for wardrobes, kitchen cabinets, etc."
  - english: "the fridge"
    german: "der Kühlschrank"
    explanation: "Compound: kühl (cool) + der Schrank. Masculine because der Schrank is masculine."
  - english: "the stove / cooker"
    german: "der Herd"
    explanation: "Masculine. Plural: die Herde. The kitchen stove where you cook."
  - english: "the kitchen"
    german: "die Küche"
    explanation: "Feminine. Plural: die Küchen. Compound words using Küche- are common: die Kühlschranktür."
  - english: "the bathroom"
    german: "das Bad"
    explanation: "Neuter. Short for das Badezimmer. Plural: die Bäder (umlaut). Also used in: das Schwimmbad."
  - english: "the balcony"
    german: "der Balkon"
    explanation: "Masculine. Plural: die Balkone or die Balkons. Borrowed from French."
  - english: "the garden"
    german: "der Garten"
    explanation: "Masculine. Plural: die Gärten (umlaut, no added letter). Common compound: der Kindergarten."
  - english: "the apartment / flat"
    german: "die Wohnung"
    explanation: "Feminine (-ung suffix = always feminine). Plural: die Wohnungen."
  - english: "the money"
    german: "das Geld"
    explanation: "Neuter, used only in the singular (uncountable). You 'haben' money or 'brauchen' it."
  - english: "the ticket (transport)"
    german: "die Fahrkarte"
    explanation: "Compound: fahren + die Karte (card). Feminine because die Karte is feminine. For concerts/events use das Ticket."
  - english: "the price"
    german: "der Preis"
    explanation: "Masculine. Plural: die Preise. Also means 'prize/award' — context distinguishes the meaning."
  - english: "the supermarket"
    german: "der Supermarkt"
    explanation: "Compound: super + der Markt (market). Masculine. Plural: die Supermärkte (umlaut)."
  - english: "the bakery"
    german: "die Bäckerei"
    explanation: "Feminine (-ei suffix = always feminine). Plural: die Bäckereien. Formed from der Bäcker (baker)."
  - english: "the restaurant"
    german: "das Restaurant"
    explanation: "Neuter. Plural: die Restaurants. Borrowed from French."
  - english: "the café"
    german: "das Café"
    explanation: "Neuter. Plural: die Cafés. The accent on the e is kept in German spelling."
  - english: "the coffee"
    german: "der Kaffee"
    explanation: "Masculine, uncountable in general but ein Kaffee = a cup of coffee. Double e at the end."
  - english: "the tea"
    german: "der Tee"
    explanation: "Masculine. Plural: die Tees (rarely used). Double e, like Kaffee."
  - english: "the beer"
    german: "das Bier"
    explanation: "Neuter. Plural: die Biere (types of beer) or informally die Bier. Ein Bier = a glass of beer."
  - english: "the wine"
    german: "der Wein"
    explanation: "Masculine. Plural: die Weine. Ein Glas Wein = a glass of wine."
  - english: "the juice"
    german: "der Saft"
    explanation: "Masculine. Plural: die Säfte (umlaut). Commonly: der Apfelsaft, der Orangensaft."
  - english: "the egg"
    german: "das Ei"
    explanation: "Neuter. Plural: die Eier. Short words ending in a vowel are often neuter."
  - english: "the meat"
    german: "das Fleisch"
    explanation: "Neuter, used only as uncountable mass noun (no plural). Contrast: der Fisch (countable)."
  - english: "the fish"
    german: "der Fisch"
    explanation: "Masculine. Plural: die Fische. Same form is used for the animal and the food."
  - english: "the vegetables"
    german: "das Gemüse"
    explanation: "Neuter, used as a collective uncountable noun (no plural). Always singular: das Gemüse."
  - english: "the fruit"
    german: "das Obst"
    explanation: "Neuter, collective uncountable (no plural). For individual fruits use specific words: der Apfel, die Banane."
  - english: "the tomato"
    german: "die Tomate"
    explanation: "Feminine (-e ending, borrowed). Plural: die Tomaten."
  - english: "the potato"
    german: "die Kartoffel"
    explanation: "Feminine. Plural: die Kartoffeln (-n plural). One of the few -el nouns that is feminine."
  - english: "the salad"
    german: "der Salat"
    explanation: "Masculine. Plural: die Salate. Can mean the vegetable (lettuce) or the prepared dish."
  - english: "the banana"
    german: "die Banane"
    explanation: "Feminine (-e ending borrowed noun). Plural: die Bananen."
  - english: "the pear"
    german: "die Birne"
    explanation: "Feminine. Plural: die Birnen. Also informally used to mean 'lightbulb' (die Glühbirne)."
  - english: "the cheese"
    german: "der Käse"
    explanation: "Masculine, uncountable as a food. Plural: die Käse (types of cheese). Note the final -e."
  - english: "the butter"
    german: "die Butter"
    explanation: "Feminine, uncountable. No plural. One of the few food nouns that is feminine."
  - english: "the cake"
    german: "der Kuchen"
    explanation: "Masculine. Plural: die Kuchen (no change). Common: der Geburtstagskuchen."
  - english: "the bread roll"
    german: "das Brötchen"
    explanation: "The -chen diminutive suffix makes any noun neuter (das). From das Brot + -chen. Plural: die Brötchen."
  - english: "the weather"
    german: "das Wetter"
    explanation: "Neuter, used only in the singular. Always used with 'es': Es gibt schönes Wetter."
  - english: "the sun"
    german: "die Sonne"
    explanation: "Feminine. The sun shines: Die Sonne scheint. No plural needed in everyday use."
  - english: "the rain"
    german: "der Regen"
    explanation: "Masculine. Uncountable. Es regnet = it is raining; bei diesem Regen = in this rain."
  - english: "the wind"
    german: "der Wind"
    explanation: "Masculine. Plural: die Winde. Es ist windig = it is windy."
  - english: "the snow"
    german: "der Schnee"
    explanation: "Masculine, uncountable. Es schneit = it is snowing. The -ee ending is rare."
  - english: "the head"
    german: "der Kopf"
    explanation: "Masculine. Plural: die Köpfe (umlaut + e). Common: Kopfschmerzen (headache)."
  - english: "the eye"
    german: "das Auge"
    explanation: "Neuter. Plural: die Augen. Note the final -e in singular: das Auge, not *das Aug."
  - english: "the hand"
    german: "die Hand"
    explanation: "Feminine. Plural: die Hände (umlaut + e). Jemanden die Hand geben = to shake someone's hand."
  - english: "the foot"
    german: "der Fuß"
    explanation: "Masculine. Plural: die Füße (umlaut + e). Zu Fuß gehen = to go on foot."
  - english: "the arm"
    german: "der Arm"
    explanation: "Masculine. Plural: die Arme. Body parts are mostly masculine or feminine."
  - english: "the mouth"
    german: "der Mund"
    explanation: "Masculine. Plural: die Münder (umlaut). Mund aufmachen = to open one's mouth."
  - english: "the hair"
    german: "das Haar"
    explanation: "Neuter. Singular das Haar = one strand; plural die Haare = hair (in general). Germans usually say Er hat lange Haare (plural)."
  - english: "the stomach / belly"
    german: "der Bauch"
    explanation: "Masculine. Plural: die Bäuche (umlaut + e). Bauchschmerzen = stomachache."
  - english: "the sport"
    german: "der Sport"
    explanation: "Masculine, used as uncountable. Sport treiben / Sport machen = to do sport."
  - english: "the hobby"
    german: "das Hobby"
    explanation: "Neuter (borrowed). Plural: die Hobbys. English -y words borrowed into German are often neuter."
  - english: "the film / movie"
    german: "der Film"
    explanation: "Masculine. Plural: die Filme. Einen Film anschauen = to watch a movie."
  - english: "the music"
    german: "die Musik"
    explanation: "Feminine, uncountable. No plural. Musik hören = to listen to music."
  - english: "the game"
    german: "das Spiel"
    explanation: "Neuter. Plural: die Spiele. Also used for sports matches: das Fußballspiel."
  - english: "the park"
    german: "der Park"
    explanation: "Masculine. Plural: die Parks. Im Park spazieren gehen = to walk in the park."
  - english: "the post office"
    german: "die Post"
    explanation: "Feminine. Also means 'mail/post' (uncountable): Ist Post für mich da? = Is there any mail for me?"
  - english: "the bank"
    german: "die Bank"
    explanation: "Feminine. Two meanings: die Bank (financial institution) vs. die Bank (bench/seat in a park) — same word, same gender."
  - english: "the hospital"
    german: "das Krankenhaus"
    explanation: "Compound: krank (sick) + das Haus (house). Neuter. Plural: die Krankenhäuser."
  - english: "the pharmacy"
    german: "die Apotheke"
    explanation: "Feminine (-e ending). Distinct from die Drogerie (drugstore — no prescription items)."
  - english: "the glass"
    german: "das Glas"
    explanation: "Neuter. Plural: die Gläser (umlaut). Ein Glas Wasser = a glass of water."
  - english: "the cup"
    german: "die Tasse"
    explanation: "Feminine (-e ending). Plural: die Tassen. Eine Tasse Kaffee = a cup of coffee."
  - english: "the plate"
    german: "der Teller"
    explanation: "Masculine. Plural: die Teller (no change). The -er plural without umlaut."
  - english: "the lamp"
    german: "die Lampe"
    explanation: "Feminine (-e ending). Plural: die Lampen."
  - english: "the newspaper"
    german: "die Zeitung"
    explanation: "Feminine (-ung = always feminine). Plural: die Zeitungen. Zeitung lesen = to read the newspaper."
  - english: "the teacher (male)"
    german: "der Lehrer"
    explanation: "Masculine. The -er suffix for professions is typically masculine. Plural: die Lehrer (no change)."
  - english: "the teacher (female)"
    german: "die Lehrerin"
    explanation: "The -in suffix creates feminine professions. Plural: die Lehrerinnen (double n)."
  - english: "the doctor (male)"
    german: "der Arzt"
    explanation: "Masculine. Plural: die Ärzte (umlaut + e). Zum Arzt gehen = to go to the doctor."
  - english: "the student (male)"
    german: "der Student"
    explanation: "Weak masculine: accusative/dative/genitive add -en: den Studenten. Plural: die Studenten."
  - english: "the colleague (male)"
    german: "der Kollege"
    explanation: "Weak masculine: all cases except nominative add -n: des Kollegen. Plural: die Kollegen."
  - english: "the work / job"
    german: "die Arbeit"
    explanation: "Feminine. Plural: die Arbeiten. Arbeit suchen = to look for work. Masculine der Arbeiter = worker."
  - english: "the profession / job title"
    german: "der Beruf"
    explanation: "Masculine. Plural: die Berufe. Was ist Ihr Beruf? = What is your profession?"
  - english: "the holiday / vacation"
    german: "der Urlaub"
    explanation: "Masculine, typically singular. Im Urlaub = on holiday. Urlaub nehmen = to take leave."
  - english: "the pencil"
    german: "der Bleistift"
    explanation: "Compound: blei (lead) + der Stift (pen/stick). Masculine. Plural: die Bleistifte."

  # ── Clothing (Kleidung) — very common on A1 Sprechen picture cards ──
  - english: "the jacket / coat (light)"
    german: "die Jacke"
    explanation: "Feminine. Plural: die Jacken. Lighter than der Mantel. Zieh die Jacke an = put on your jacket."
  - english: "the coat (heavy)"
    german: "der Mantel"
    explanation: "Masculine. Plural: die Mäntel (umlaut). Heavier outerwear than die Jacke."
  - english: "the trousers / pants"
    german: "die Hose"
    explanation: "Feminine, but refers to a single garment (not plural like in English). Plural: die Hosen."
  - english: "the dress"
    german: "das Kleid"
    explanation: "Neuter. Plural: die Kleider. Die Kleidung (no plural) = clothing in general."
  - english: "the shirt (button-down)"
    german: "das Hemd"
    explanation: "Neuter. Plural: die Hemden. For a T-shirt: das T-Shirt."
  - english: "the blouse"
    german: "die Bluse"
    explanation: "Feminine. Plural: die Blusen. Women's equivalent of das Hemd."
  - english: "the skirt"
    german: "der Rock"
    explanation: "Masculine. Plural: die Röcke (umlaut + e). Unrelated to English 'rock'."
  - english: "the shoe"
    german: "der Schuh"
    explanation: "Masculine. Plural: die Schuhe. Zieh die Schuhe aus = take off your shoes."
  - english: "the sock"
    german: "die Socke"
    explanation: "Feminine. Plural: die Socken. Usually used in the plural: Socken anziehen."
  - english: "the hat"
    german: "der Hut"
    explanation: "Masculine. Plural: die Hüte (umlaut). Contrast: die Mütze (woollen beanie/cap)."
  - english: "the scarf"
    german: "der Schal"
    explanation: "Masculine. Plural: die Schals. Worn around the neck in winter."
  - english: "the sweater / jumper"
    german: "der Pullover"
    explanation: "Masculine (borrowed from English 'pullover'). Plural: die Pullover. Colloquially: der Pulli."
  - english: "the T-shirt"
    german: "das T-Shirt"
    explanation: "Neuter (borrowed). Plural: die T-Shirts."
  - english: "the jeans"
    german: "die Jeans"
    explanation: "Plural form borrowed from English, but in German used as both singular and plural: eine Jeans / die Jeans."

  # ── Family members (Familie) ──
  - english: "the grandfather"
    german: "der Großvater"
    explanation: "Compound: groß + der Vater. Masculine. Colloquially: der Opa. Plural: die Großväter."
  - english: "the grandmother"
    german: "die Großmutter"
    explanation: "Compound: groß + die Mutter. Feminine. Colloquially: die Oma. Plural: die Großmütter."
  - english: "the grandpa (informal)"
    german: "der Opa"
    explanation: "Informal for der Großvater. Masculine. Plural: die Opas."
  - english: "the grandma (informal)"
    german: "die Oma"
    explanation: "Informal for die Großmutter. Feminine. Plural: die Omas."
  - english: "the son"
    german: "der Sohn"
    explanation: "Masculine. Plural: die Söhne (umlaut + e)."
  - english: "the daughter"
    german: "die Tochter"
    explanation: "Feminine. Plural: die Töchter (umlaut). One of the few feminine nouns with umlaut plural."
  - english: "the husband"
    german: "der Ehemann"
    explanation: "Compound: die Ehe (marriage) + der Mann. Colloquially just 'mein Mann'. Plural: die Ehemänner."
  - english: "the wife"
    german: "die Ehefrau"
    explanation: "Compound: die Ehe + die Frau. Colloquially just 'meine Frau'. Plural: die Ehefrauen."

  # ── Rooms in the house (Räume) — common in A1 Wohnen topic ──
  - english: "the living room"
    german: "das Wohnzimmer"
    explanation: "Compound: wohnen (to live) + das Zimmer. Neuter. Plural: die Wohnzimmer."
  - english: "the bedroom"
    german: "das Schlafzimmer"
    explanation: "Compound: schlafen (to sleep) + das Zimmer. Neuter. Plural: die Schlafzimmer."
  - english: "the children's room"
    german: "das Kinderzimmer"
    explanation: "Compound: das Kind + das Zimmer. Neuter."
  - english: "the entrance / hallway"
    german: "der Flur"
    explanation: "Masculine. Plural: die Flure. The entrance corridor of a flat or building."

  # ── Kitchen utensils (Küchenutensilien) ──
  - english: "the fork"
    german: "die Gabel"
    explanation: "Feminine. Plural: die Gabeln. Part of das Besteck (cutlery)."
  - english: "the knife"
    german: "das Messer"
    explanation: "Neuter. Plural: die Messer (no change). The -er plural without umlaut."
  - english: "the spoon"
    german: "der Löffel"
    explanation: "Masculine. Plural: die Löffel (no change). Most -el nouns are masculine."
  - english: "the pot / saucepan"
    german: "der Topf"
    explanation: "Masculine. Plural: die Töpfe (umlaut + e). Used on the herd (stove)."
  - english: "the frying pan"
    german: "die Pfanne"
    explanation: "Feminine. Plural: die Pfannen. Compound: die Bratpfanne (frying pan, literally 'roasting pan')."

  # ── More foods (Lebensmittel) — common on Sprechen picture cards ──
  - english: "the sausage"
    german: "die Wurst"
    explanation: "Feminine. Plural: die Würste (umlaut + e). Very common in German cuisine."
  - english: "the ham"
    german: "der Schinken"
    explanation: "Masculine. Plural: die Schinken (no change)."
  - english: "the sugar"
    german: "der Zucker"
    explanation: "Masculine, uncountable. Kein Zucker, bitte = no sugar please."
  - english: "the salt"
    german: "das Salz"
    explanation: "Neuter, uncountable. Das Salz, bitte = the salt please."
  - english: "the soup"
    german: "die Suppe"
    explanation: "Feminine. Plural: die Suppen."
  - english: "the ice cream"
    german: "das Eis"
    explanation: "Neuter. Used for both ice cream and ice (frozen water). Context usually makes it clear."
  - english: "the orange"
    german: "die Orange"
    explanation: "Feminine. Plural: die Orangen. Also: der Apfelsine (regional variant)."
  - english: "the strawberry"
    german: "die Erdbeere"
    explanation: "Compound: die Erde (earth) + die Beere (berry). Feminine. Plural: die Erdbeeren."

  # ── City / public places (Orte in der Stadt) ──
  - english: "the cinema / movie theater"
    german: "das Kino"
    explanation: "Neuter. Plural: die Kinos. Ins Kino gehen = to go to the cinema."
  - english: "the swimming pool"
    german: "das Schwimmbad"
    explanation: "Compound: schwimmen + das Bad. Neuter. Plural: die Schwimmbäder (umlaut)."
  - english: "the library"
    german: "die Bibliothek"
    explanation: "Feminine (-ek suffix borrowed words are often feminine). Plural: die Bibliotheken."
  - english: "the market"
    german: "der Markt"
    explanation: "Masculine. Plural: die Märkte (umlaut + e). Auf dem Markt = at the market."
  - english: "the department store"
    german: "das Kaufhaus"
    explanation: "Compound: kaufen + das Haus. Neuter. Plural: die Kaufhäuser."
  - english: "the church"
    german: "die Kirche"
    explanation: "Feminine. Plural: die Kirchen. In der Kirche = in the church."
  - english: "the museum"
    german: "das Museum"
    explanation: "Neuter. Plural: die Museen (Latin -um → -een). Ins Museum gehen = to go to the museum."
  - english: "the sports hall / gym"
    german: "die Turnhalle"
    explanation: "Compound: turnen (gymnastics) + die Halle (hall). Feminine."
  - english: "the car park / parking lot"
    german: "der Parkplatz"
    explanation: "Compound: parken + der Platz (place/square). Masculine. Plural: die Parkplätze."
  - english: "the underground / subway"
    german: "die U-Bahn"
    explanation: "Compound: U (= Untergrund, underground) + die Bahn. Feminine. Mit der U-Bahn fahren."
  - english: "the tram"
    german: "die Straßenbahn"
    explanation: "Compound: die Straße + die Bahn. Feminine. Common city transport in Germany."

  # ── Nature (Natur) ──
  - english: "the tree"
    german: "der Baum"
    explanation: "Masculine. Plural: die Bäume (umlaut + e)."
  - english: "the flower"
    german: "die Blume"
    explanation: "Feminine. Plural: die Blumen. Blumen kaufen = to buy flowers."
  - english: "the sea / ocean"
    german: "das Meer"
    explanation: "Neuter. Plural: die Meere. Am Meer = by the sea. Contrast: der See (lake)."
  - english: "the lake"
    german: "der See"
    explanation: "Masculine. Plural: die Seen. Note: die See (feminine) = the sea (literary/nautical). Same spelling, different gender and meaning!"
  - english: "the mountain"
    german: "der Berg"
    explanation: "Masculine. Plural: die Berge. In die Berge fahren = to go to the mountains."
  - english: "the river"
    german: "der Fluss"
    explanation: "Masculine. Plural: die Flüsse (umlaut + e). Am Fluss = by the river."

  # ── More body parts (Körper) ──
  - english: "the leg"
    german: "das Bein"
    explanation: "Neuter. Plural: die Beine. Also informally means 'bone' in some compounds."
  - english: "the back"
    german: "der Rücken"
    explanation: "Masculine. Plural: die Rücken (no change). Rückenschmerzen = back pain."
  - english: "the ear"
    german: "das Ohr"
    explanation: "Neuter. Plural: die Ohren. Ohrenschmerzen = earache."
  - english: "the nose"
    german: "die Nase"
    explanation: "Feminine. Plural: die Nasen."
  - english: "the neck / throat"
    german: "der Hals"
    explanation: "Masculine. Plural: die Hälse (umlaut + e). Halsschmerzen = sore throat."
  - english: "the shoulder"
    german: "die Schulter"
    explanation: "Feminine. Plural: die Schultern (-n plural)."
  - english: "the knee"
    german: "das Knie"
    explanation: "Neuter. Plural: die Knie (no change — -ie plural). Knieschmerzen = knee pain."
  - english: "the tooth"
    german: "der Zahn"
    explanation: "Masculine. Plural: die Zähne (umlaut + e). Zahnschmerzen = toothache."

  # ── Other A1 exam essentials ──
  - english: "the pen / pencil (general)"
    german: "der Stift"
    explanation: "Masculine. Plural: die Stifte. General word for writing instrument; specify: Kugelschreiber (ballpoint) or Bleistift (pencil)."
  - english: "the notebook"
    german: "das Heft"
    explanation: "Neuter. Plural: die Hefte. School/exercise notebook."
  - english: "the dictionary"
    german: "das Wörterbuch"
    explanation: "Compound: das Wort + das Buch. Neuter. Plural: die Wörterbücher (umlaut)."
  - english: "the watch / clock"
    german: "die Uhr"
    explanation: "Feminine. Plural: die Uhren. Die Armbanduhr = wristwatch; die Wanduhr = wall clock."
  - english: "the ticket (event)"
    german: "das Ticket"
    explanation: "Neuter (borrowed). Plural: die Tickets. For transport use die Fahrkarte."
  - english: "the map / card"
    german: "die Karte"
    explanation: "Feminine. Plural: die Karten. Multiple meanings: playing card, map, menu, greeting card, ticket."
  - english: "the appointment"
    german: "der Termin"
    explanation: "Masculine. Plural: die Termine. Einen Termin machen/haben = to make/have an appointment."
  - english: "the problem"
    german: "das Problem"
    explanation: "Neuter (borrowed). Plural: die Probleme. Kein Problem! = No problem!"
  - english: "the answer"
    german: "die Antwort"
    explanation: "Feminine. Plural: die Antworten. Eine Antwort geben = to give an answer."
  - english: "the question"
    german: "die Frage"
    explanation: "Feminine. Plural: die Fragen. Eine Frage stellen = to ask a question."
  - english: "the language"
    german: "die Sprache"
    explanation: "Feminine. Plural: die Sprachen. Welche Sprachen sprichst du? = What languages do you speak?"
  - english: "the passport"
    german: "der Pass"
    explanation: "Masculine. Plural: die Pässe (umlaut + e). Auch: der Reisepass (travel passport)."
  - english: "the identity card"
    german: "der Ausweis"
    explanation: "Masculine. Plural: die Ausweise. Haben Sie Ihren Ausweis dabei? = Do you have your ID?"
