id: essen_trinken
label: "Essen & Trinken"
description: "Food and drink vocabulary"
exercises:
  - english: "bread"
    german: "das Brot"
  - english: "water"
    german: "das Wasser"
  - english: "coffee"
    german: "der Kaffee"
  - english: "tea"
    german: "der Tee"
  - english: "milk"
    german: "die Milch"
  - english: "apple"
    german: "der Apfel"
  - english: "banana"
    german: "die Banane"
  - english: "cheese"
    german: "der Käse"
    explanation: "'der Käse' is masculine despite the -e ending that often signals feminine."
  - english: "butter"
    german: "die Butter"
    explanation: "'die Butter' is feminine — not predictable; English speakers often guess wrong."
  - english: "eggs"
    german: "die Eier"
    explanation: "Irregular plural: das Ei → die Eier."
  - english: "meat"
    german: "das Fleisch"
  - english: "fish"
    german: "der Fisch"
  - english: "soup"
    german: "die Suppe"
  - english: "cake"
    german: "der Kuchen"
  - english: "juice"
    german: "der Saft"
  - english: "beer"
    german: "das Bier"
  - english: "wine"
    german: "der Wein"
  - english: "I like coffee"
    german: "Ich mag Kaffee"
    explanation: "'mögen' is irregular: ich mag (no -e ending), du magst, er/sie mag."
  - english: "I eat bread"
    german: "Ich esse Brot"
    explanation: "'essen' is irregular (e→i): ich esse, du isst, er/sie isst."
  - english: "I drink water"
    german: "Ich trinke Wasser"
