id: verben
label: "Verben"
description: "Basic A1 verbs conjugated in present tense"
exercises:
  - english: "I go"
    german: "Ich gehe"
  - english: "You come"
    german: "Du kommst"
  - english: "He eats"
    german: "Er isst"
    explanation: "'essen' is irregular with an e→i stem change in 2nd/3rd person: ich esse, du isst, er/sie isst."
  - english: "We drink"
    german: "Wir trinken"
  - english: "They sleep"
    german: "Sie schlafen"
    explanation: "'schlafen' adds an umlaut (a→ä) in the singular (du schläfst, er schläft), but the plural 'sie schlafen' is regular."
  - english: "I work"
    german: "Ich arbeite"
    explanation: "'arbeiten' inserts an extra -e- before consonant endings for pronounceability: du arbeitest, er/sie arbeitet."
  - english: "You learn"
    german: "Du lernst"
  - english: "He speaks"
    german: "Er spricht"
    explanation: "'sprechen' is a strong verb with an e→i stem change: du sprichst, er/sie spricht."
  - english: "We live"
    german: "Wir wohnen"
  - english: "They play"
    german: "Sie spielen"
  - english: "I read"
    german: "Ich lese"
    explanation: "'lesen' has an e→ie stem change in 2nd/3rd person singular: du liest, er/sie liest."
  - english: "You write"
    german: "Du schreibst"
  - english: "He runs"
    german: "Er läuft"
    explanation: "'laufen' takes an umlaut (au→äu) in 2nd/3rd person singular: du läufst, er/sie läuft."
  - english: "We swim"
    german: "Wir schwimmen"
  - english: "They cook"
    german: "Sie kochen"
  - english: "I drive"
    german: "Ich fahre"
    explanation: "'fahren' takes an umlaut (a→ä) in 2nd/3rd person singular: du fährst, er/sie fährt."
  - english: "You help"
    german: "Du hilfst"
    explanation: "'helfen' has an e→i stem change in 2nd/3rd person singular: du hilfst, er/sie hilft."
  - english: "He sings"
    german: "Er singt"
  - english: "We travel"
    german: "Wir reisen"
  - english: "They buy"
    german: "Sie kaufen"
  - english: "I have"
    german: "Ich habe"
    explanation: "'haben' is irregular: ich habe, du hast, er/sie hat — the -b- drops in 2nd/3rd person singular."
  - english: "You are"
    german: "Du bist"
    explanation: "'sein' is the most irregular German verb: ich bin, du bist, er/sie ist, wir sind, ihr seid, sie sind."
  - english: "He is"
    german: "Er ist"
  - english: "We are"
    german: "Wir sind"
  - english: "They have"
    german: "Sie haben"
  - english: "I can"
    german: "Ich kann"
    explanation: "Modal verb: 1st and 3rd person singular are identical (ich kann / er kann) — no personal ending."
  - english: "You must"
    german: "Du musst"
    explanation: "Modal: ich muss, du musst, er/sie muss — 1st/3rd singular share the same form."
  - english: "He wants"
    german: "Er will"
    explanation: "'wollen' is irregular: ich will, du willst, er/sie will — stem change in singular."
  - english: "We may / are allowed to"
    german: "Wir dürfen"
    explanation: "Modal: singular is ich darf / du darfst / er darf; plural restores the infinitive stem: wir dürfen."
  - english: "They should"
    german: "Sie sollen"
  - english: "I see"
    german: "Ich sehe"
    explanation: "'sehen' has an e→ie stem change in 2nd/3rd person singular: du siehst, er/sie sieht."
  - english: "You hear"
    german: "Du hörst"
  - english: "He understands"
    german: "Er versteht"
    explanation: "'verstehen' is a compound of 'stehen'; conjugates like stehen but cannot be separated."
  - english: "We know (a fact)"
    german: "Wir wissen"
    explanation: "'wissen' behaves like a modal in the singular: ich weiß, du weißt, er/sie weiß — the -ss- becomes -ß-."
  - english: "They find"
    german: "Sie finden"
    explanation: "'finden' adds an extra -e- before consonant endings when the stem ends in -nd: du findest, er findet."
  - english: "I say"
    german: "Ich sage"
  - english: "You ask"
    german: "Du fragst"
  - english: "He answers"
    german: "Er antwortet"
    explanation: "'antworten' has a -t stem ending, so it inserts -e- before more consonants: du antwortest, er antwortet."
  - english: "We wait"
    german: "Wir warten"
    explanation: "'warten' also has a -t stem; ihr wartet takes the -et ending for pronounceability."
  - english: "They think"
    german: "Sie denken"
    explanation: "'denken' is a mixed verb: regular present (denke/denkst/denkt), but strong past: dachte."
  - english: "I open"
    german: "Ich öffne"
    explanation: "'öffnen' ends in -ffn-; to avoid three consonants du öffnest drops to du öffnest — the -e- is inserted."
  - english: "You close"
    german: "Du schließt"
    explanation: "'schließen' ends in ß (a long-vowel s), so no extra -t is needed: du schließt (not *schließest)."
  - english: "He pays"
    german: "Er bezahlt"
  - english: "We order"
    german: "Wir bestellen"
  - english: "I like"
    german: "Ich mag"
    explanation: "'mögen' is a modal: ich mag, du magst, er/sie mag — no ending in 1st/3rd singular."
  - english: "You would like"
    german: "Du möchtest"
    explanation: "'möchten' is the Konjunktiv II of mögen used as a polite present. It has modal-like forms: ich möchte, du möchtest."
  - english: "He needs"
    german: "Er braucht"
  - english: "We bring"
    german: "Wir bringen"
    explanation: "'bringen' is a mixed verb: regular present, but strong-like past: brachte."
  - english: "They call"
    german: "Sie rufen an"
    explanation: "'anrufen' is separable: the prefix 'an' detaches and goes to the end in the main clause."
  - english: "I make"
    german: "Ich mache"
  - english: "You take"
    german: "Du nimmst"
    explanation: "'nehmen' is strongly irregular: ich nehme, du nimmst, er/sie nimmt — a double stem change."
  - english: "He gives"
    german: "Er gibt"
    explanation: "'geben' has an e→i stem change in 2nd/3rd person singular: du gibst, er/sie gibt."
  - english: "We show"
    german: "Wir zeigen"
  - english: "They visit"
    german: "Sie besuchen"
  - english: "I dance"
    german: "Ich tanze"
  - english: "You shower"
    german: "Du duschst"
    explanation: "'duschen' ends in -sch; 2nd person singular contracts to du duschst (no extra -e-)."
  - english: "He gets up"
    german: "Er steht auf"
    explanation: "'aufstehen' is separable: 'auf' moves to the end in the main clause. Strong verb: stand auf."
  - english: "We stay"
    german: "Wir bleiben"
    explanation: "'bleiben' is a strong verb: past tense blieb. Regular in the present."
  - english: "They greet"
    german: "Sie begrüßen"
  - english: "I wash (myself)"
    german: "Ich wasche mich"
    explanation: "Reflexive: 'mich' is the accusative reflexive pronoun for ich. 'waschen' also has a→ä in 2nd/3rd singular: du wäschst, er wäscht."
  - english: "You look / watch"
    german: "Du schaust"
  - english: "He searches"
    german: "Er sucht"
  - english: "We sell"
    german: "Wir verkaufen"
  - english: "They begin"
    german: "Sie beginnen"
    explanation: "'beginnen' is a strong verb: past tense begann. The double -n is kept throughout the present."
  - english: "I go shopping"
    german: "Ich gehe einkaufen"
    explanation: "'einkaufen' stays as an infinitive here because it depends on the finite verb 'gehe'."
  - english: "You watch TV"
    german: "Du schaust fern"
    explanation: "'fernsehen' is separable: er sieht fern. Here 'schauen' is used colloquially instead of 'sehen'."
  - english: "We listen"
    german: "Wir hören zu"
    explanation: "'zuhören' is separable: 'zu' goes to the end. Distinct from 'hören' (to hear) — this means to listen attentively."
  - english: "They know (a person or place)"
    german: "Sie kennen"
    explanation: "'kennen' = to know a person or place (acquaintance). 'wissen' = to know a fact. Both are irregular."
  - english: "I meet"
    german: "Ich treffe"
    explanation: "'treffen' has an e→i stem change: du triffst, er/sie trifft."
  - english: "You eat breakfast"
    german: "Du frühstückst"
    explanation: "'frühstücken' ends in -ck; 2nd person singular: du frühstückst (no inserted -e-)."
  - english: "We hike"
    german: "Wir wandern"
    explanation: "'-ern' verbs: the -e- before -r drops in 1st/3rd person plural: wir wandern (not *wanderen)."
  - english: "They marry"
    german: "Sie heiraten"
    explanation: "'heiraten' ends in -t; sie heiraten is regular, but du heiratest, er/sie heiratet take the inserted -e-."
  - english: "I explain"
    german: "Ich erkläre"
  - english: "You invite"
    german: "Du lädst ein"
    explanation: "'einladen' is separable and strong: a→ä umlaut in 2nd/3rd singular (du lädst ein, er lädt ein)."
  - english: "He recommends"
    german: "Er empfiehlt"
    explanation: "'empfehlen' has e→ie stem change in 2nd/3rd singular: du empfiehlst, er/sie empfiehlt."
  - english: "We repair"
    german: "Wir reparieren"
    explanation: "'-ieren' verbs: always regular, never an umlaut, and no -ge- in the past participle: repariert."
  - english: "They move (home)"
    german: "Sie ziehen um"
    explanation: "'umziehen' is separable and strong: past tense zogen um. The prefix 'um' moves to end in main clauses."
  - english: "I telephone"
    german: "Ich telefoniere"
    explanation: "'-ieren' verb: regular throughout. No umlaut, no irregular forms."
  - english: "He hikes / walks"
    german: "Er wandert"
    explanation: "'-ern' verb in 3rd person: er wandert (the -e- between -nd- and -t is inserted for pronounceability)."
  - english: "We go for a walk"
    german: "Wir gehen spazieren"
    explanation: "'spazieren gehen' is a fixed phrase; 'spazieren' is the infinitive used as a direction."
  - english: "They live (be alive)"
    german: "Sie leben"
    explanation: "'leben' = to be alive / to live (in a general sense). 'wohnen' = to reside at an address. Both are regular."
  - english: "I lie (be lying down)"
    german: "Ich liege"
    explanation: "'liegen' = to lie/be lying (position). 'legen' = to lay/put (action). Both strong in the past."
  - english: "You sit"
    german: "Du sitzt"
    explanation: "'sitzen' is strong in the past (saß) but regular in the present."
  - english: "He stands"
    german: "Er steht"
  - english: "I smell"
    german: "Ich rieche"
    explanation: "'riechen' is a strong verb: past tense roch. Regular in the present."
  - english: "You taste (something)"
    german: "Du schmeckst"
    explanation: "'schmecken' is often impersonal: Das schmeckt gut. (That tastes good.) Literally 'it tastes to me'."
  - english: "It costs"
    german: "Es kostet"
    explanation: "'kosten' is impersonal in pricing: Wie viel kostet das? The subject is usually 'es' or the thing being priced."
  - english: "We find"
    german: "Wir finden"
  - english: "They use"
    german: "Sie benutzen"
  - english: "I receive / get"
    german: "Ich bekomme"
    explanation: "'bekommen' = to receive/get. Do NOT confuse with English 'become' — that is 'werden' in German."
  - english: "You send"
    german: "Du schickst"
  - english: "He registers / checks in"
    german: "Er meldet sich an"
    explanation: "'sich anmelden' is reflexive + separable: 'an' goes to the end, 'sich' stays near the verb."
  - english: "I start (begin)"
    german: "Ich fange an"
    explanation: "'anfangen' is separable and strong: a→ä in 2nd/3rd singular (du fängst an, er fängt an)."
  - english: "You finish / stop"
    german: "Du hörst auf"
    explanation: "'aufhören' is separable: 'auf' moves to the end. Literally 'to stop hearing' but means to stop/finish."
  - english: "He begins"
    german: "Er beginnt"
    explanation: "'beginnen' is a strong verb. Note the double -n stays: er beginnt, not *begingt."
  - english: "We sign"
    german: "Wir unterschreiben"
    explanation: "'unterschreiben' is a compound inseparable verb (unter- prefix stays attached). Strong past: unterschrieb."
  - english: "They pick up / collect"
    german: "Sie holen ab"
    explanation: "'abholen' is separable: 'ab' goes to the end. Used for picking up people or packages."
  - english: "I grill / barbecue"
    german: "Ich grille"
  - english: "You celebrate"
    german: "Du feierst"
  - english: "He laughs"
    german: "Er lacht"
  - english: "We forget"
    german: "Wir vergessen"
    explanation: "'vergessen' has an e→i stem change in 2nd/3rd singular: du vergisst, er/sie vergisst."
  - english: "They remember"
    german: "Sie erinnern sich"
    explanation: "'sich erinnern' is reflexive: 'sich' in accusative. Plus 'an + accusative' for what you remember."
  - english: "I agree"
    german: "Ich stimme zu"
    explanation: "'zustimmen' is separable: 'zu' goes to the end. Ich stimme zu = I agree."
  - english: "You arrive"
    german: "Du kommst an"
    explanation: "'ankommen' is separable: 'an' goes to end. Strong verb: past tense kam an."
  - english: "He leaves / departs"
    german: "Er fährt ab"
    explanation: "'abfahren' is separable and strong: a→ä in 2nd/3rd singular (du fährst ab, er fährt ab)."
  - english: "We get on (a vehicle)"
    german: "Wir steigen ein"
    explanation: "'einsteigen' is separable and strong: past stieg ein. Used for boarding trains, buses, etc."
  - english: "They get off (a vehicle)"
    german: "Sie steigen aus"
    explanation: "'aussteigen' is separable and strong. Opposite of einsteigen."
  - english: "I turn on (a light)"
    german: "Ich mache an"
    explanation: "'anmachen' is separable and colloquial for turning on lights/devices. More formal: einschalten."
  - english: "You turn off (a light)"
    german: "Du machst aus"
    explanation: "'ausmachen' is separable. Also means 'to matter': Das macht nichts aus (That doesn't matter)."
  - english: "He fills out (a form)"
    german: "Er füllt aus"
    explanation: "'ausfüllen' is separable: 'aus' goes to end. Always used with Formular (form)."
  - english: "We cross (a street)"
    german: "Wir überqueren"
    explanation: "'überqueren' is inseparable (über- prefix stays). Regular verb."
  - english: "They enjoy"
    german: "Sie genießen"
    explanation: "'genießen' is a strong verb: past tense genoss. Regular in the present."
  - english: "I try"
    german: "Ich versuche"
    explanation: "'versuchen' is inseparable (ver- prefix). Regular. Also used with infinitive: Ich versuche zu schlafen."
  - english: "You reserve / book"
    german: "Du reservierst"
    explanation: "'-ieren' verb: always regular, no umlaut."
  - english: "He visits (a sight)"
    german: "Er besichtigt"
    explanation: "'besichtigen' = to visit/tour a place. Inseparable (be- prefix). Du besichtigst, er besichtigt."
  - english: "We change (trains)"
    german: "Wir steigen um"
    explanation: "'umsteigen' is separable and strong: past stieg um. Used when changing trains/buses."
  - english: "They rent"
    german: "Sie mieten"
