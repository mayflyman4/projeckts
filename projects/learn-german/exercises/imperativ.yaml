id: imperativ
label: "Imperativ"
description: "Command forms — du, ihr and Sie (Geh!, Kommt!, Kommen Sie!)"
exercises:
  - english: "Go! (to one friend)"
    german: "Geh!"
    explanation: "du-imperative: take the present 'du gehst', drop the -st ending and the pronoun → Geh! No subject, no -st."
  - english: "Come! (to one friend)"
    german: "Komm!"
    explanation: "du-imperative of 'kommen': du kommst → drop -st and 'du' → Komm! Regular verbs follow this pattern."
  - english: "Wait! (to one friend)"
    german: "Warte!"
    explanation: "du-imperative of 'warten'. The stem ends in -t, so an -e is kept for pronounceability: Warte! (not *Wart!)."
  - english: "Listen! (to one friend)"
    german: "Hör zu!"
    explanation: "du-imperative of separable 'zuhören': the prefix 'zu' goes to the end → Hör zu! Drop -st and 'du' from the stem part."
  - english: "Speak slowly! (to one friend)"
    german: "Sprich langsam!"
    explanation: "du-imperative of 'sprechen'. Strong verbs with e→i KEEP the stem change: du sprichst → Sprich! (no -e added)."
  - english: "Take the book! (to one friend)"
    german: "Nimm das Buch!"
    explanation: "du-imperative of 'nehmen'. Strong e→i change stays: du nimmst → Nimm! No -e for e→i verbs."
  - english: "Eat! (to one friend)"
    german: "Iss!"
    explanation: "du-imperative of 'essen'. e→i change kept: du isst → Iss! No pronoun, no -e."
  - english: "Read the text! (to one friend)"
    german: "Lies den Text!"
    explanation: "du-imperative of 'lesen'. e→ie change stays: du liest → Lies! Strong-verb stem changes are preserved."
  - english: "Give me the book! (to one friend)"
    german: "Gib mir das Buch!"
    explanation: "du-imperative of 'geben' with a dative pronoun: e→i kept → Gib! 'mir' = to me (dative)."
  - english: "Be quiet! (to one friend)"
    german: "Sei ruhig!"
    explanation: "'sein' is irregular in the imperative: du-form is simply 'Sei!' — no ending, no pronoun."
  - english: "Don't be afraid! (to one friend)"
    german: "Hab keine Angst!"
    explanation: "du-imperative of 'haben': Hab! (the -e is usually dropped in speech). 'keine Angst haben' = to not be afraid."
  - english: "Go! (to several friends)"
    german: "Geht!"
    explanation: "ihr-imperative: identical to the present 'ihr geht', just drop the pronoun 'ihr' → Geht!"
  - english: "Come! (to several friends)"
    german: "Kommt!"
    explanation: "ihr-imperative = present tense 'ihr kommt' minus the pronoun → Kommt!"
  - english: "Wait! (to several friends)"
    german: "Wartet!"
    explanation: "ihr-imperative of 'warten' = ihr wartet → Wartet! Same form as the present, pronoun dropped."
  - english: "Be quiet! (to several friends)"
    german: "Seid leise!"
    explanation: "'sein' is irregular: the ihr-imperative is 'Seid!' (from 'ihr seid'). 'leise' = quiet/soft."
  - english: "Come in! (formal)"
    german: "Kommen Sie herein!"
    explanation: "Sie-imperative: verb first, then 'Sie' → Kommen Sie! The pronoun stays. 'herein' = inward/in."
  - english: "Please wait! (formal)"
    german: "Warten Sie bitte!"
    explanation: "Sie-imperative of 'warten': Warten Sie! 'bitte' softens any command and is very common in the exam."
  - english: "Please speak slowly! (formal)"
    german: "Sprechen Sie bitte langsam!"
    explanation: "Sie-imperative: no stem change needed (the Sie-form = infinitive). Verb first: Sprechen Sie …!"
  - english: "Take a seat! (formal)"
    german: "Nehmen Sie Platz!"
    explanation: "Sie-imperative of 'nehmen': 'Platz nehmen' = to take a seat. Fixed polite phrase."
  - english: "Be careful! (formal)"
    german: "Seien Sie vorsichtig!"
    explanation: "'sein' is irregular here too: the Sie-imperative is 'Seien Sie!' — not *Sind Sie. 'vorsichtig' = careful."
  - english: "Excuse me! (formal)"
    german: "Entschuldigen Sie!"
    explanation: "Sie-imperative of 'entschuldigen'. Standard polite way to get someone's attention or apologize."
  - english: "Listen! (formal)"
    german: "Hören Sie zu!"
    explanation: "Sie-imperative of separable 'zuhören': verb first (Hören Sie), prefix 'zu' to the end → Hören Sie zu!"
  - english: "Open the window, please! (formal)"
    german: "Machen Sie bitte das Fenster auf!"
    explanation: "Sie-imperative of separable 'aufmachen': the prefix 'auf' goes to the very end → Machen Sie … auf!"
  - english: "Read the question! (formal)"
    german: "Lesen Sie die Frage!"
    explanation: "Sie-imperative of 'lesen': no stem change in the Sie-form. Common exam instruction."
