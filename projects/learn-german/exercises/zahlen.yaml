id: zahlen
label: "Zahlen"
description: "Numbers and counting"
exercises:
  - english: "one"
    german: "eins"
  - english: "two"
    german: "zwei"
  - english: "three"
    german: "drei"
  - english: "four"
    german: "vier"
  - english: "five"
    german: "fünf"
  - english: "six"
    german: "sechs"
  - english: "seven"
    german: "sieben"
  - english: "eight"
    german: "acht"
  - english: "nine"
    german: "neun"
  - english: "ten"
    german: "zehn"
  - english: "eleven"
    german: "elf"
  - english: "twelve"
    german: "zwölf"
  - english: "twenty"
    german: "zwanzig"
  - english: "thirty"
    german: "dreißig"
    explanation: "Spelled '-ßig' (dreißig), not '-zig' like the other tens (zwanzig, vierzig) — a common spelling trap."
  - english: "one hundred"
    german: "hundert"
    explanation: "German omits 'ein' here: just 'hundert' (or 'einhundert'), unlike English 'one/a hundred'."
  - english: "one thousand"
    german: "tausend"
    explanation: "German omits 'ein' here: just 'tausend' (or 'eintausend'), unlike English 'one/a thousand'."
  - english: "How old are you?"
    german: "Wie alt bist du?"
  - english: "I am 25 years old"
    german: "Ich bin fünfundzwanzig Jahre alt"
    explanation: "Compound numbers are one word with units before tens joined by 'und': fünfundzwanzig (literally 'five-and-twenty')."
  - english: "It costs 5 euros"
    german: "Es kostet fünf Euro"
    explanation: "'Euro' stays uninflected after a number (fünf Euro, not 'Euros'); currency units take no plural ending here."
  - english: "I need two tickets"
    german: "Ich brauche zwei Tickets"
