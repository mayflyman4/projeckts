<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #4F46E5 0%, #7C3AED 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .app-header {
            width: 100%;
            max-width: 760px;
            padding: 20px 20px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }

        .app-title {
            color: white;
            font-size: clamp(18px, 5vw, 26px);
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .score-bar { display: flex; align-items: center; gap: 10px; }

        .back-link, .mock-test-link {
            padding: 6px 14px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 700;
            color: white;
            background: rgba(255,255,255,0.15);
            border: 1.5px solid rgba(255,255,255,0.45);
            text-decoration: none;
            white-space: nowrap;
            transition: background 0.18s, border-color 0.18s;
        }
        .back-link:hover, .mock-test-link:hover {
            background: rgba(255,255,255,0.28);
            border-color: rgba(255,255,255,0.75);
        }

        .score-pill {
            padding: 5px 14px;
            border-radius: 999px;
            font-size: 14px;
            font-weight: 700;
            min-width: 20px;
            text-align: center;
        }
        .score-pill.lives { color: white; background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.35); letter-spacing: 2px; }

        /* ── Progress + question counter ── */
        .progress-row {
            width: 100%;
            max-width: 760px;
            padding: 14px 20px 0;
            display: none;
        }
        .progress-label {
            color: rgba(255,255,255,0.85);
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 6px;
            text-align: center;
        }
        .progress-bar-track {
            height: 5px;
            background: rgba(255,255,255,0.25);
            border-radius: 999px;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            background: rgba(255,255,255,0.85);
            border-radius: 999px;
            transition: width 0.4s ease;
        }

        /* ── Content card ── */
        .content-wrap {
            width: 100%;
            max-width: 760px;
            padding: 16px 20px 40px;
            flex: 1;
        }

        .card {
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.25);
            padding: 28px 26px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .card-title {
            font-size: 18px;
            font-weight: 800;
            color: #1E1B4B;
        }

        .card-sub { font-size: 13px; color: #6B7280; margin-top: -12px; }

        .divider { height: 1px; background: #E8E5FF; }

        .paragraph {
            font-size: 19px;
            line-height: 2.1;
            color: #1E1B4B;
        }

        /* blanks */
        .blank-wrap { display: inline-flex; align-items: center; gap: 4px; position: relative; }

        .blank-input {
            width: 92px;
            padding: 4px 8px;
            font-size: 17px;
            font-family: inherit;
            border: 2px solid #C7D2FE;
            border-radius: 8px;
            text-align: center;
            color: #1E1B4B;
            outline: none;
        }
        .blank-input.scaffold { color: #9CA3AF; }
        .blank-input:focus { border-color: #6366F1; box-shadow: 0 0 0 3px rgba(99,102,241,0.15); }
        .blank-input.correct { border-color: #10B981; background: #ECFDF5; color: #065F46; }
        .blank-input.wrong { border-color: #EF4444; background: #FEF2F2; color: #991B1B; }

        .hint-btn {
            border: none;
            background: none;
            font-size: 16px;
            cursor: pointer;
            line-height: 1;
            padding: 2px;
        }
        .hint-note {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            margin-top: 6px;
            background: #F5F3FF;
            border: 1px solid #E8E5FF;
            border-radius: 10px;
            padding: 8px 12px;
            font-size: 13px;
            font-weight: 600;
            color: #4F46E5;
            z-index: 5;
            width: max-content;
            max-width: 220px;
        }
        .hint-note.visible { display: block; }

        .chip {
            padding: 5px 12px;
            border-radius: 999px;
            border: 1.5px solid #C7D2FE;
            background: white;
            color: #4F46E5;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            white-space: nowrap;
            transition: background 0.15s, transform 0.1s;
        }
        .chip:hover { background: #EEF2FF; transform: translateY(-1px); }

        .correct-answer-note {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: #991B1B;
            margin-top: -8px;
        }

        .btn-primary {
            padding: 14px;
            font-size: 16px;
            font-weight: 700;
            color: white;
            background: linear-gradient(135deg, #6366F1 0%, #7C3AED 100%);
            border: none;
            border-radius: 14px;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
        }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(99,102,241,0.4); }

        .btn-secondary {
            padding: 14px;
            font-size: 16px;
            font-weight: 700;
            color: #4F46E5;
            background: #EEF2FF;
            border: 2px solid #C7D2FE;
            border-radius: 14px;
            cursor: pointer;
            transition: background 0.18s, transform 0.15s;
        }
        .btn-secondary:hover { background: #E0E7FF; transform: translateY(-1px); }
        .btn-secondary:disabled { opacity: 0.6; cursor: default; transform: none; }

        .result-banner {
            font-size: 14px;
            font-weight: 700;
            padding: 10px 14px;
            border-radius: 12px;
            text-align: center;
        }
        .result-banner.ok { background: #D1FAE5; color: #065F46; }
        .result-banner.some-wrong { background: #FEF3C7; color: #92400E; }

        /* ── Sentence builder ── */
        .prompt-en {
            font-size: 20px;
            font-weight: 700;
            color: #1E1B4B;
            text-align: center;
        }

        .sentence-line {
            min-height: 52px;
            border: 2px dashed #C7D2FE;
            border-radius: 12px;
            padding: 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-content: flex-start;
        }

        .word-bank {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .word-chip {
            padding: 8px 14px;
            border-radius: 10px;
            border: 2px solid #C7D2FE;
            background: #EEF2FF;
            color: #1E1B4B;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
        }
        .word-chip:hover { background: #E0E7FF; }
        .word-chip.placed { background: white; border-color: #A5B4FC; }

        /* ── Conjugation / article prompt ── */
        .verb-prompt {
            font-size: 22px;
            font-weight: 800;
            color: #1E1B4B;
            text-align: center;
        }
        .verb-prompt .pronoun { color: #7C3AED; }

        .chip.correct { background: #ECFDF5; border-color: #10B981; color: #065F46; }
        .chip.wrong { background: #FEF2F2; border-color: #EF4444; color: #991B1B; }
        .chip.disabled { pointer-events: none; opacity: 0.65; }

        /* ── Error Spotting ── */
        .error-sentence { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
        .word-chip.flagged { border-color: #EF4444; background: #FEF2F2; color: #991B1B; }
        .word-chip.muted { opacity: 0.55; }
        .word-chip.disabled { pointer-events: none; }
        .fix-chips { display: none; flex-wrap: wrap; gap: 8px; justify-content: center; }
        .fix-chips.visible { display: flex; }

        .status-msg { color: #6B7280; text-align: center; padding: 20px; }

        /* ── Start + completion screens ── */
        .completion-card {
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.25);
            padding: 40px 28px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
            animation: fadeSlideUp 0.35s ease;
        }
        .completion-emoji { font-size: 52px; }
        .completion-title { font-size: 26px; font-weight: 800; color: #1E1B4B; }
        .completion-sub { font-size: 15px; color: #6B7280; }
        .completion-highlight { font-size: 19px; font-weight: 600; color: #1E1B4B; }
        .completion-highlight strong { color: #7C3AED; }
        .completion-score { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
        .completion-score-pill { padding: 10px 22px; border-radius: 14px; font-size: 18px; font-weight: 800; }
        .completion-score-pill.right { background: #D1FAE5; color: #065F46; }
        .completion-score-pill.wrong { background: #FEE2E2; color: #991B1B; }

        .challenge-url {
            font-family: ui-monospace, SFMono-Regular, monospace;
            font-size: 13px;
            font-weight: 700;
            color: #4F46E5;
            background: #EEF2FF;
            border: 1.5px dashed #C7D2FE;
            border-radius: 10px;
            padding: 8px 14px;
            word-break: break-all;
        }
        .completion-btns { display: flex; flex-direction: column; gap: 10px; width: 100%; }
        .btn-retry {
            padding: 14px;
            font-size: 16px;
            font-weight: 700;
            color: white;
            background: linear-gradient(135deg, #6366F1 0%, #7C3AED 100%);
            border: none;
            border-radius: 14px;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
        }
        .btn-retry:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(99,102,241,0.4); }

        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 480px) {
            .card { padding: 22px 18px; }
            .paragraph { font-size: 17px; line-height: 2.3; }
        }
    </style>
</head>

        let DATA = FALLBACK_DATA;

        // ── DOM refs ──
        const contentWrap   = document.getElementById('contentWrap');
        const livesPill     = document.getElementById('livesPill');
        const progressRow   = document.getElementById('progressRow');
        const progressFill  = document.getElementById('progressFill');
        const progressLabel = document.getElementById('progressLabel');

        // ── Utilities (umlaut-tolerant matching, same as index.html — keep identical) ──
        function shuffle(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function normalize(s) {
            return String(s).trim().toLowerCase()
                .replace(/ü/g, 'ue').replace(/ö/g, 'oe').replace(/ä/g, 'ae')
                .replace(/ß/g, 'ss').replace(/\s+/g, ' ');
        }

        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));
        }

        // ── Quiz state ──
        const quiz = {
            deck: [], len: QUIZ_LEN, idx: 0, lives: MAX_LIVES, correct: 0,
            cardResults: [], startedAt: 0,
        };

        // Records one sub-answer's correctness within the current card. A card
        // (paragraph / sentence / verb / error / question) can call this more than
        // once (e.g. a blanks paragraph has several blanks) — the quiz collapses
        // all of a card's results into a single right/wrong via cardResults.every().
        function recordResult(correct) {
            quiz.cardResults.push(correct);
        }

        function quizEnded({ answered, lives, total }) {
            return answered >= total || lives <= 0;
        }

        function formatTime(ms) {
            const totalSec = Math.max(0, Math.round(ms / 1000));
            const m = Math.floor(totalSec / 60);
            const s = totalSec % 60;
            return `${m}:${String(s).padStart(2, '0')}`;
        }

        // ── Global keyboard handler — Enter submits/advances/starts ──
        document.addEventListener('keydown', e => {
            if (e.repeat || e.key !== 'Enter') return;

            const nextBtn = document.getElementById('nextBtn');
            if (nextBtn && nextBtn.style.display !== 'none') {
                e.preventDefault();
                nextBtn.click();
                return;
            }

            const checkBtn = document.getElementById('checkBtn');
            if (checkBtn && checkBtn.style.display !== 'none') {
                e.preventDefault();
                checkBtn.click();
                return;
            }

            const btnRetry = document.getElementById('btnRetry');
            if (btnRetry) {
                e.preventDefault();
                btnRetry.click();
                return;
            }

            const btnStart = document.getElementById('btnStart');
            if (btnStart) {
                e.preventDefault();
                btnStart.click();
            }
        });

        // ── 1. Fill in the Blanks ──
        // Grammar-category hints (German) shown via 💡 — never the answer or its
        // options, just what kind of word belongs there. Keeps the challenge intact.
        const BLANK_TYPE_HINTS = {
            verb:        'Hier fehlt ein Verb im Präsens.',
            pronoun:     'Hier fehlt ein Pronomen.',
            artikel:     'Hier fehlt ein Artikel.',
            preposition: 'Hier fehlt eine Präposition.',
        };

        function renderBlanks(overrideItem, onNext) {
            const para = overrideItem;
            const html = para.tokens.map((tok, i) => {
                if (typeof tok === 'string') return escapeHtml(tok);
                const scaffold = tok.type === 'verb' ? tok.answer.slice(0, 3) : '';
                const hint = BLANK_TYPE_HINTS[tok.type];
                return `
                    <span class="blank-wrap">
                        <input class="blank-input${scaffold ? ' scaffold' : ''}" data-blank="${i}"
                               value="${escapeHtml(scaffold)}" autocomplete="off" autocorrect="off" spellcheck="false">
                        ${hint ? `<button class="hint-btn" data-hint="${i}" type="button" title="Hinweis anzeigen">💡</button>
                        <span class="hint-note" id="hintNote-${i}">${escapeHtml(hint)}</span>` : ''}
                        <span class="correct-answer-note" id="answerNote-${i}" style="display:none"></span>
                    </span>`;
            }).join('');

            contentWrap.innerHTML = `
                <div class="card">
                    <div class="card-title">${escapeHtml(para.title)}</div>
                    <div class="card-sub">Fill in each blank, then check your answers. Tap 💡 for a grammar hint.</div>
                    <div class="divider"></div>
                    <div class="paragraph" id="paraText">${html}</div>
                    <div id="resultBanner"></div>
                    <button class="btn-primary" id="checkBtn">Check</button>
                    <button class="btn-secondary" id="nextBtn" style="display:none">Next →</button>
                </div>
            `;

            contentWrap.querySelectorAll('.hint-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.getElementById(`hintNote-${btn.dataset.hint}`).classList.toggle('visible');
                });
            });
            const blankInputs = [...contentWrap.querySelectorAll('.blank-input')];
            blankInputs.forEach((input, i) => {
                input.addEventListener('input', () => input.classList.remove('scaffold'), { once: true });
                input.addEventListener('keydown', e => {
                    if (e.key !== 'Enter') return;
                    const next = blankInputs[i + 1];
                    if (next) {
                        e.preventDefault();
                        e.stopPropagation();
                        next.focus();
                        next.select();
                    }
                    // last blank: let it bubble up to the global handler, which clicks Check
                });
            });
            if (blankInputs[0]) blankInputs[0].focus();

            document.getElementById('checkBtn').addEventListener('click', () => {
                let allCorrect = true;
                para.tokens.forEach((tok, i) => {
                    if (typeof tok === 'string') return;
                    const input = contentWrap.querySelector(`.blank-input[data-blank="${i}"]`);
                    const ok = normalize(input.value) === normalize(tok.answer);
                    input.classList.remove('scaffold');
                    input.classList.toggle('correct', ok);
                    input.classList.toggle('wrong', !ok);
                    recordResult(ok);
                    if (!ok) {
                        allCorrect = false;
                        const note = document.getElementById(`answerNote-${i}`);
                        note.textContent = `→ ${tok.answer}`;
                        note.style.display = 'block';
                    }
                });
                document.getElementById('resultBanner').innerHTML =
                    `<div class="result-banner ${allCorrect ? 'ok' : 'some-wrong'}">${allCorrect ? '✓ All correct!' : 'Some answers need work — see corrections above.'}</div>`;
                document.getElementById('checkBtn').style.display = 'none';
                document.getElementById('nextBtn').style.display = 'block';
            });

            document.getElementById('nextBtn').addEventListener('click', () => {
                onNext();
            });
        }

        // ── 2. Word-order drill factory (shared by Sentence Builder + W-Frage Builder) ──
        function createWordOrderDrill({ promptField, answerField, cardTitle, cardSub, showPrompt = true }) {
            let bank = [];
            let placed = [];
            let lastItem = null;

            function render(overrideItem, onNext) {
                const item = overrideItem;
                if (item !== lastItem) {
                    bank = shuffle(item[answerField].split(' ').map((w, i) => ({ word: w, id: i })));
                    placed = [];
                    lastItem = item;
                }

                contentWrap.innerHTML = `
                    <div class="card">
                        <div class="card-title">${escapeHtml(cardTitle)}</div>
                        <div class="card-sub">${escapeHtml(cardSub)}</div>
                        <div class="divider"></div>
                        ${showPrompt ? `<div class="prompt-en">${escapeHtml(item[promptField])}</div>` : ''}
                        <div class="sentence-line" id="sentenceLine">
                            ${placed.map(w => `<button class="word-chip placed" data-id="${w.id}" data-zone="placed" type="button">${escapeHtml(w.word)}</button>`).join('')}
                        </div>
                        <div class="word-bank" id="wordBank">
                            ${bank.map(w => `<button class="word-chip" data-id="${w.id}" data-zone="bank" type="button">${escapeHtml(w.word)}</button>`).join('')}
                        </div>
                        <div id="resultBanner"></div>
                        <button class="btn-primary" id="checkBtn">Check</button>
                        <button class="btn-secondary" id="nextBtn" style="display:none">Next →</button>
                    </div>
                `;

                contentWrap.querySelectorAll('.word-chip[data-zone="bank"]').forEach(chip => {
                    chip.addEventListener('click', () => {
                        const id = Number(chip.dataset.id);
                        const wIdx = bank.findIndex(w => w.id === id);
                        placed.push(bank[wIdx]);
                        bank.splice(wIdx, 1);
                        render(overrideItem, onNext);
                    });
                });
                contentWrap.querySelectorAll('.word-chip[data-zone="placed"]').forEach(chip => {
                    chip.addEventListener('click', () => {
                        const id = Number(chip.dataset.id);
                        const wIdx = placed.findIndex(w => w.id === id);
                        bank.push(placed[wIdx]);
                        placed.splice(wIdx, 1);
                        render(overrideItem, onNext);
                    });
                });

                document.getElementById('checkBtn').addEventListener('click', () => {
                    const built = placed.map(w => w.word).join(' ');
                    const ok = normalize(built) === normalize(item[answerField]);
                    recordResult(ok);
                    document.getElementById('resultBanner').innerHTML = ok
                        ? `<div class="result-banner ok">✓ Correct!</div>`
                        : `<div class="result-banner some-wrong">Not quite — correct order: <strong>${escapeHtml(item[answerField])}</strong></div>`;
                    document.getElementById('checkBtn').style.display = 'none';
                    document.getElementById('nextBtn').style.display = 'block';
                });

                document.getElementById('nextBtn').addEventListener('click', () => {
                    onNext();
                });
            }

            return { render };
        }

        const builderDrill = createWordOrderDrill({
            promptField: 'prompt', answerField: 'answer',
            cardTitle: 'Sentence Builder', cardSub: 'Tap the words in the right order to build the German sentence.',
        });

        const wfrageDrill = createWordOrderDrill({
            promptField: 'context', answerField: 'question', showPrompt: false,
            cardTitle: 'W-Frage Builder', cardSub: 'Tap the words in the right order to form a correct W-question.',
        });

        // ── 3. Conjugation drill ──
        const PRONOUNS = ['ich', 'du', 'er/sie/es', 'wir', 'ihr', 'sie/Sie'];

        function renderConj(overrideItem, onNext) {
            const { verb, pronoun } = overrideItem;

            contentWrap.innerHTML = `
                <div class="card">
                    <div class="card-title">Conjugation Drill</div>
                    <div class="card-sub">Type the correct present-tense form.</div>
                    <div class="divider"></div>
                    <div class="verb-prompt">${escapeHtml(verb.inf)} → <span class="pronoun">${escapeHtml(pronoun)}</span> ___</div>
                    <input class="blank-input" id="conjInput" style="width:100%; text-align:left" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="Type the conjugated form…">
                    <div id="resultBanner"></div>
                    <button class="btn-primary" id="checkBtn">Check</button>
                    <button class="btn-secondary" id="nextBtn" style="display:none">Next →</button>
                </div>
            `;

            document.getElementById('conjInput').focus();

            document.getElementById('checkBtn').addEventListener('click', () => {
                const input = document.getElementById('conjInput');
                const ok = normalize(input.value) === normalize(verb.forms[pronoun]);
                input.classList.toggle('correct', ok);
                input.classList.toggle('wrong', !ok);
                recordResult(ok);
                document.getElementById('resultBanner').innerHTML = ok
                    ? `<div class="result-banner ok">✓ Correct!</div>`
                    : `<div class="result-banner some-wrong">Not quite — correct: <strong>${escapeHtml(verb.forms[pronoun])}</strong></div>`;
                document.getElementById('checkBtn').style.display = 'none';
                document.getElementById('nextBtn').style.display = 'block';
            });

            document.getElementById('nextBtn').addEventListener('click', () => {
                onNext();
            });
        }

        // ── 4. Error Spotting ──
        function renderErrors(overrideItem, onNext) {
            const ex = overrideItem;

            contentWrap.innerHTML = `
                <div class="card">
                    <div class="card-title">Error Spotting</div>
                    <div class="card-sub">One word in this sentence is wrong. Tap it, then pick the fix.</div>
                    <div class="divider"></div>
                    <div class="error-sentence" id="errorSentence">
                        ${ex.tokens.map((w, i) => `<button class="word-chip" data-idx="${i}" type="button">${escapeHtml(w)}</button>`).join('')}
                    </div>
                    <div class="fix-chips" id="fixChips">
                        ${ex.options.map(o => `<button class="chip" data-val="${escapeHtml(o)}" type="button">${escapeHtml(o)}</button>`).join('')}
                    </div>
                    <div id="resultBanner"></div>
                    <button class="btn-secondary" id="nextBtn" style="display:none">Next →</button>
                </div>
            `;

            contentWrap.querySelectorAll('#errorSentence .word-chip').forEach(word => {
                word.addEventListener('click', () => {
                    const clickedIdx = Number(word.dataset.idx);
                    contentWrap.querySelectorAll('#errorSentence .word-chip').forEach(w => w.classList.add('disabled'));
                    word.classList.add(clickedIdx === ex.wrongIdx ? 'flagged' : 'muted');
                    if (clickedIdx !== ex.wrongIdx) {
                        contentWrap.querySelector(`#errorSentence .word-chip[data-idx="${ex.wrongIdx}"]`).classList.add('flagged');
                    }
                    recordResult(clickedIdx === ex.wrongIdx);
                    document.getElementById('fixChips').classList.add('visible');
                });
            });

            document.getElementById('fixChips').addEventListener('click', e => {
                const chip = e.target.closest('.chip');
                if (!chip) return;
                const ok = chip.dataset.val === ex.correct;
                contentWrap.querySelectorAll('#fixChips .chip').forEach(c => {
                    c.classList.add('disabled');
                    if (c.dataset.val === ex.correct) c.classList.add('correct');
                    else if (c === chip) c.classList.add('wrong');
                });
                recordResult(ok);
                document.getElementById('resultBanner').innerHTML = ok
                    ? `<div class="result-banner ok">✓ Fixed correctly!</div>`
                    : `<div class="result-banner some-wrong">Correct fix: <strong>${escapeHtml(ex.correct)}</strong></div>`;
                document.getElementById('nextBtn').style.display = 'block';
            });

            document.getElementById('nextBtn').addEventListener('click', () => {
                onNext();
            });
        }

        // ── 5. Quiz controller — up to 15 questions, 3 lives, no clock during play ──
        function buildDeck(section) {
            const entries = [];
            const addConj = () => DATA.conj.forEach(verb =>
                entries.push({ type: 'conj', item: { verb, pronoun: PRONOUNS[Math.floor(Math.random() * PRONOUNS.length)] } }));
            if (section === 'all') {
                DATA.blanks.forEach(item => entries.push({ type: 'blanks', item }));
                DATA.builder.forEach(item => entries.push({ type: 'builder', item }));
                addConj();
                DATA.errors.forEach(item => entries.push({ type: 'errors', item }));
                DATA.wfrage.forEach(item => entries.push({ type: 'wfrage', item }));
            } else if (section === 'conj') {
                addConj();
            } else {
                DATA[section].forEach(item => entries.push({ type: section, item }));
            }
            return shuffle(entries).slice(0, QUIZ_LEN);
        }

        function updateHeader() {
            livesPill.textContent = '❤️'.repeat(quiz.lives) + '🖤'.repeat(MAX_LIVES - quiz.lives);
            progressLabel.textContent = `Question ${Math.min(quiz.idx + 1, quiz.len)} / ${quiz.len}`;
            progressFill.style.width = `${(quiz.idx / quiz.len) * 100}%`;
        }

        function renderQuizCard() {
            quiz.cardResults = [];
            const entry = quiz.deck[quiz.idx];
            updateHeader();

            const onNext = () => {
                const cardCorrect = quiz.cardResults.length > 0 && quiz.cardResults.every(Boolean);
                if (cardCorrect) quiz.correct++; else quiz.lives--;
                quiz.idx++;
                updateHeader();
                if (quizEnded({ answered: quiz.idx, lives: quiz.lives, total: quiz.len })) {
                    endQuiz();
                } else {
                    renderQuizCard();
                }
            };

            ({
                blanks:  () => renderBlanks(entry.item, onNext),
                builder: () => builderDrill.render(entry.item, onNext),
                conj:    () => renderConj(entry.item, onNext),
                errors:  () => renderErrors(entry.item, onNext),
                wfrage:  () => wfrageDrill.render(entry.item, onNext),
            })[entry.type]();
        }

        function startQuiz(section) {
            quiz.deck = buildDeck(section);
            quiz.len = quiz.deck.length;
            quiz.idx = 0;
            quiz.lives = MAX_LIVES;
            quiz.correct = 0;
            quiz.cardResults = [];
            quiz.startedAt = Date.now();
            progressRow.style.display = 'block';
            renderQuizCard();
        }

        function endQuiz() {
            const reason = quiz.lives <= 0 ? 'lives' : 'complete';
            renderResult(reason);
        }

        // ── Start screen — pick All sections or a single section ──
        function renderStart() {
            progressRow.style.display = 'none';
            livesPill.textContent = '';
            contentWrap.innerHTML = `
                <div class="completion-card">
                    <div class="completion-emoji">🏆</div>
                    <div class="completion-title">A1 Challenge</div>
                    <div class="completion-sub">${QUIZ_LEN} questions · 3 lives</div>
                    <div class="completion-sub">A wrong answer costs a life. Pick a mode to start.</div>
                    <div class="completion-btns">
                        ${SECTIONS.map(s => `<button class="${s.key === 'all' ? 'btn-retry' : 'btn-secondary'}"${s.key === 'all' ? ' id="btnStart"' : ''} data-section="${s.key}" type="button">${escapeHtml(s.label)}</button>`).join('')}
                    </div>
                </div>
            `;
            contentWrap.querySelectorAll('[data-section]').forEach(btn => {
                btn.addEventListener('click', () => startQuiz(btn.dataset.section));
            });
        }

        // ── Result screen ──
        function renderResult(reason) {
            progressRow.style.display = 'none';
            livesPill.textContent = '';

            const total = quiz.len;
            const pct = total ? Math.round((quiz.correct / total) * 100) : 0;
            const emoji = pct >= 80 ? '🎉' : pct >= 50 ? '👍' : '💪';
            const livesUsed = MAX_LIVES - quiz.lives;
            const elapsedStr = formatTime(Date.now() - quiz.startedAt);
            const reasonText = {
                complete: '🎉 Challenge complete!',
                lives:    '💔 Out of lives!',
            }[reason];

            contentWrap.innerHTML = `
                <div class="completion-card">
                    <div class="completion-emoji">${emoji}</div>
                    <div class="completion-title">${reasonText}</div>
                    <div class="completion-highlight">You answered <strong>${quiz.correct}</strong> correctly!</div>
                    <div class="completion-score">
                        <div class="completion-score-pill right">✓ ${quiz.correct} correct</div>
                        <div class="completion-score-pill wrong">${'❤️'.repeat(quiz.lives)}${'🖤'.repeat(livesUsed)}</div>
                    </div>
                    <div class="completion-sub">${livesUsed} of ${MAX_LIVES} lives used · finished in ${elapsedStr}</div>
                    <div class="challenge-friend">
                        <div class="completion-sub">🔥 Think you can beat me? Try the A1 Challenge:</div>
                        <div class="challenge-url">${escapeHtml(CHALLENGE_URL_DISPLAY)}</div>
                    </div>
                    <div class="completion-btns">
                        <button class="btn-secondary" id="btnShare">📤 Share score</button>
                        <button class="btn-retry" id="btnRetry">Retake ↻</button>
                    </div>
                </div>
            `;

            document.getElementById('btnShare').addEventListener('click', async e => {
                const btn = e.currentTarget;
                const original = btn.textContent;
                btn.disabled = true;
                const result = await shareScore({ correct: quiz.correct, total, livesUsed, timeStr: elapsedStr });
                btn.disabled = false;
                btn.textContent = result === 'shared' ? '✓ Shared!' : '✓ Saved — caption copied!';
                setTimeout(() => { btn.textContent = original; }, 2200);
            });
            document.getElementById('btnRetry').addEventListener('click', renderStart);
        }

        // ── Share — renders a score card to canvas, shares via OS share sheet
        // where available (mobile/https), else downloads the PNG + copies a caption.
        // Note: no web API posts directly to a specific app like Instagram — the
        // OS share sheet (navigator.share) is the closest, and only exists on
        // secure contexts, so it won't appear when opened via file://. ──
        function drawScoreCard({ correct, total, livesUsed, timeStr }) {
            const canvas = document.createElement('canvas');
            canvas.width = 1080;
            canvas.height = 1080;
            const ctx = canvas.getContext('2d');

            const grad = ctx.createLinearGradient(0, 0, 1080, 1080);
            grad.addColorStop(0, '#4F46E5');
            grad.addColorStop(1, '#7C3AED');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 1080, 1080);

            ctx.textAlign = 'center';
            ctx.fillStyle = 'white';
            ctx.font = '700 56px -apple-system, "Segoe UI", Roboto, sans-serif';
            ctx.fillText('🇩🇪 A1 German Challenge', 540, 250);

            ctx.font = '800 180px -apple-system, "Segoe UI", Roboto, sans-serif';
            ctx.fillText(`${correct} / ${total}`, 540, 490);

            ctx.font = '400 48px -apple-system, "Segoe UI", Roboto, sans-serif';
            ctx.fillStyle = 'rgba(255,255,255,0.85)';
            ctx.fillText('correct', 540, 555);

            const hearts = '❤️'.repeat(Math.max(0, MAX_LIVES - livesUsed)) + '🖤'.repeat(livesUsed);
            ctx.font = '64px -apple-system, sans-serif';
            ctx.fillStyle = 'white';
            ctx.fillText(hearts, 540, 700);

            ctx.font = '48px -apple-system, sans-serif';
            ctx.fillText(`⏱ ${timeStr}`, 540, 790);

            ctx.font = '700 40px -apple-system, sans-serif';
            ctx.fillStyle = 'rgba(255,255,255,0.85)';
            ctx.fillText('#LernDeutsch', 540, 900);

            ctx.font = '400 32px -apple-system, sans-serif';
            ctx.fillText('Think you can beat me? Try it:', 540, 970);

            // Shrink the URL to fit the card width rather than letting it clip off the edge.
            let urlSize = 36;
            while (urlSize > 16) {
                ctx.font = `600 ${urlSize}px ui-monospace, SFMono-Regular, monospace`;
                if (ctx.measureText(CHALLENGE_URL_DISPLAY).width <= 960) break;
                urlSize -= 2;
            }
            ctx.fillStyle = 'white';
            ctx.fillText(CHALLENGE_URL_DISPLAY, 540, 1020);

            return canvas;
        }

        function downloadBlob(blob, filename) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);
        }

        function copyCaption(text) {
            navigator.clipboard?.writeText(text).catch(() => {});
        }

        async function shareScore(scoreInfo) {
            const canvas = drawScoreCard(scoreInfo);
            const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
            const caption = `I scored ${scoreInfo.correct}/${scoreInfo.total} on the A1 German Challenge in ${scoreInfo.timeStr}! 🇩🇪 #LernDeutsch\nThink you can beat me? Try it: ${CHALLENGE_URL}`;

            if (blob) {
                const file = new File([blob], 'a1-challenge.png', { type: 'image/png' });
                if (navigator.canShare?.({ files: [file] })) {
                    try {
                        await navigator.share({ files: [file], text: caption });
                        return 'shared';
                    } catch {
                        // user cancelled the share sheet — fall through to download
                    }
                }
                downloadBlob(blob, 'a1-challenge.png');
            }
            copyCaption(caption);
            return 'downloaded';
        }

        // ── Data loading — YAML over http(s), FALLBACK_DATA on file:// (fetch fails there) ──
        async function loadPracticeData() {
            const sections = ['blanks', 'builder', 'conj', 'errors', 'wfrage'];
            try {
                const entries = await Promise.all(sections.map(async s => {
                    const r = await fetch(`./practice_exercises/${s}.yaml`, { cache: 'no-store' });
                    if (!r.ok) throw new Error(`missing practice_exercises/${s}.yaml`);
                    return [s, jsyaml.load(await r.text())];
                }));
                return Object.fromEntries(entries);
            } catch {
                return FALLBACK_DATA;
            }
        }

        // ── Self-check (fails loudly in console if core logic breaks) ──
        (function selfTest() {
            console.assert(normalize('Frühstücke') === normalize('fruehstuecke'), 'normalize() umlaut mapping broken');
            console.assert(normalize('groß') === normalize('gross'), 'normalize() ß mapping broken');
            console.assert(normalize(' Ich   bin ') === normalize('ich bin'), 'normalize() whitespace/case handling broken');
            console.assert(quizEnded({ answered: 15, lives: 3, total: 15 }) === true, 'quizEnded() should end when all questions answered');
            console.assert(quizEnded({ answered: 0, lives: 0, total: 15 }) === true, 'quizEnded() should end when out of lives');
            console.assert(quizEnded({ answered: 10, lives: 3, total: 15 }) === false, 'quizEnded() should not end mid-quiz');
        })();

        // ── Boot ──
        (async function boot() {
            DATA = await loadPracticeData();
            renderStart();
        })();
    </script>
